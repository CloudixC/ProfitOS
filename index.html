<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRA Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f0e8;--bg2:#ffffff;--bg3:#ede6d6;--border:#d4c9b0;--border2:#c4b89a;
  --gold:#a08530;--cream:#2a2318;--muted:#6b6050;--dim:#8a7d6b;--dark:#a09580;
  --sidebar:#faf7f0;--modal:#ffffff;--inputBg:#f5f0e8;--inputBorder:#d4c9b0;
  --overlay:rgba(0,0,0,.3);--navActive:#a08530;--navActiveTxt:#fff;--statBg:#faf7f2;
  --pg:#a8d8b9;--pr:#e8a8a8;--pb:#a8c8e8;--pp:#c8a8e8;--py:#e8d8a8;--po:#e8c0a0;
  --heading:'Playfair Display',Georgia,serif;
}
[data-theme="dark"] {
  --bg:#0f0e0a;--bg2:#1a1710;--bg3:#12110d;--border:#2a2520;--border2:#3a352e;
  --gold:#c9a84c;--cream:#ede6d6;--muted:#8a7d6b;--dim:#6b6050;--dark:#4a4538;
  --sidebar:#12110d;--modal:#1a1710;--inputBg:#12110d;--inputBorder:#2a2520;
  --overlay:rgba(0,0,0,.7);--navActive:#c9a84c;--navActiveTxt:#0f0e0a;--statBg:#16140f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--cream);transition:background .3s,color .3s}
h1,h2,h3,.lux-heading{font-family:var(--heading);letter-spacing:-0.3px}
h1{font-size:28px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes su{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.an{animation:su .3s ease}
.mn{font-family:'JetBrains Mono',monospace}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;overflow-y:auto;max-height:100vh}
.main{flex:1;padding:28px 36px;overflow-y:auto;max-height:100vh}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.stat-card{background:var(--statBg);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
.stat-label{font-size:9.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-family:'Outfit',sans-serif}
.stat-value{font-size:22px;font-weight:700;margin-top:6px}
button{font-family:'Outfit',sans-serif;cursor:pointer;transition:all .15s}
button:active{transform:scale(.97)}
.btn{padding:9px 18px;border:none;border-radius:9px;font-weight:600;font-size:13px}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a08530);color:var(--navActiveTxt)}
.btn-blue{background:linear-gradient(135deg,#7ca8c4,#5a8eaa);color:#fff}
.btn-orange{background:linear-gradient(135deg,#d4956a,#b87848);color:#fff}
.btn-purple{background:linear-gradient(135deg,#b48ecc,#9668b0);color:#fff}
.btn-ghost{background:var(--border);color:var(--muted);border:none}
.nav-btn{padding:10px 16px;border-radius:9px;font-weight:500;font-size:13px;border:none;background:none;color:var(--dim);text-align:left;width:100%;display:flex;align-items:center;gap:9px}
.nav-btn:hover{background:var(--bg2);color:var(--cream)}
.nav-btn.active{background:var(--navActive);color:var(--navActiveTxt);font-weight:600}
.inp{background:var(--inputBg);border:1px solid var(--inputBorder);border-radius:9px;padding:11px 14px;color:var(--cream);font-size:13px;width:100%;outline:none;font-family:'Outfit',sans-serif}
.inp:focus{border-color:var(--gold)}
select.inp{appearance:auto}
optgroup{font-weight:700;font-style:normal;color:var(--gold);font-size:11px;padding:4px 0}
optgroup option{font-weight:400;color:var(--cream);font-size:13px;padding:4px 8px}
.label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.freq-badge{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase}
.freq-monthly{background:#e8f4f8;color:#5a8eaa}
.freq-onetime{background:#faf5e8;color:#a08530}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;animation:fi .15s}
.modal{background:var(--modal);border:1px solid var(--border);border-radius:18px;padding:28px;width:92%;max-width:560px;max-height:90vh;overflow-y:auto;animation:su .25s}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flex-gap{display:flex;gap:8px}
.mb-10{margin-bottom:10px}
.mb-14{margin-bottom:14px}
.mb-18{margin-bottom:18px}
.toggle-track{width:34px;height:18px;border-radius:9px;position:relative;cursor:pointer;transition:background .3s}
.toggle-dot{width:14px;height:14px;border-radius:7px;position:absolute;top:2px;transition:left .3s}
.addr-dropdown{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.addr-item{width:100%;text-align:left;padding:10px 12px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--cream);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif}
.addr-item:hover{background:var(--bg3)}
.tip-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all .2s}
.tip-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.tip-card.open{border-color:var(--gold)}
.alert{border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:13px;animation:su .3s}
.progress-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .5s}

/* CEO Dashboard Premium Styles */
.hero-stat{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 18px;position:relative;overflow:hidden;transition:all .25s}
.hero-stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:var(--border2)}
.hero-stat .hs-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin-bottom:6px}
.hero-stat .hs-value{font-size:24px;font-weight:800;letter-spacing:-0.8px}
.math-equation{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px;background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:14px;margin-bottom:20px;flex-wrap:wrap}
.math-op{font-size:16px;color:var(--dim);font-weight:800;font-family:'JetBrains Mono',monospace}
.math-block{text-align:center;padding:0 4px}
.math-block .mb-val{font-weight:700;letter-spacing:-0.3px}
.math-block .mb-lbl{font-size:9px;color:var(--dark);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.math-result .mb-val{font-size:18px !important;font-weight:800 !important}
.ceo-section{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.ceo-section:hover{border-color:var(--border2)}
.ceo-section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ceo-section-header h3{font-size:17px;font-weight:700;margin:0;font-family:var(--heading);letter-spacing:-0.2px}
.ceo-section-accent{position:absolute;top:0;left:0;right:0;height:2px}
.biz-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.biz-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.06);border-color:var(--border2)}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stagger-1{animation:countUp .4s ease .05s both}
.stagger-2{animation:countUp .4s ease .1s both}
.stagger-3{animation:countUp .4s ease .15s both}
.stagger-4{animation:countUp .4s ease .2s both}
.stagger-5{animation:countUp .4s ease .25s both}
.stagger-6{animation:countUp .4s ease .3s both}
[data-theme="dark"] .hero-stat:hover{box-shadow:0 8px 24px rgba(0,0,0,.3)}
[data-theme="dark"] .biz-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.3)}
@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;gap:6px;max-height:none;flex-wrap:nowrap}
  .sidebar .nav-btn{white-space:nowrap;width:auto;min-width:fit-content}
  .sidebar .sidebar-extra{display:none}
  .main{padding:12px 10px}
  .grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}
  .hero-stat{padding:12px 10px;min-width:0}
  .hero-stat .stat-value{font-size:18px!important}
  .card{padding:14px}
  .stat-card{padding:12px}
  h1{font-size:22px}
  .overlay>div{width:95%!important;max-width:none!important;margin:10px!important;max-height:90vh!important}
}
@media(max-width:480px){
  .main{padding:8px 6px}
  h1{font-size:18px}
  .hero-stat .stat-value{font-size:15px!important}
  .hero-stat .stat-label{font-size:9px!important}
}
[data-theme="dark"] .card{box-shadow:0 2px 8px rgba(0,0,0,.2)}
[data-theme="dark"] .overlay>div{background:var(--modal);border-color:var(--border)}
[data-theme="dark"] .inp{background:var(--inputBg);border-color:var(--inputBorder);color:var(--cream)}
[data-theme="dark"] select.inp{background:var(--inputBg);color:var(--cream)}
</style>
</head>

function icon(name,size){size=size||20;const el=document.createElement("img");el.src=ICONS[name]||"";el.style.cssText="width:"+size+"px;height:"+size+"px;vertical-align:middle;display:inline-block;flex-shrink:0";return el;}

// Utilities
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
function fmt(n){const v=Number(n)||0;if(v<0)return`-$${Math.abs(v).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})}`;return`$${v.toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function entryTotal(e){
  const a=Number(e.amount)||0;
  if(e.hstMode==="plus")return Math.round(a*1.13*100)/100;
  return a;
}
function entryHST(e){
  const a=Number(e.amount)||0;
  if(e.hstMode==="plus")return Math.round(a*0.13*100)/100;
  if(e.hstMode==="included")return Math.round(a*0.13/1.13*100)/100;
  return 0;
}
function calcTax(inc,br){let t=0;for(const b of br){if(inc<=b.n)break;t+=(Math.min(inc,b.x)-b.n)*b.r;}return t;}
function haversine(lat1,lon1,lat2,lon2){const R=6371,dL=(lat2-lat1)*Math.PI/180,dN=(lon2-lon1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dN/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*1.35*10)/10;}
function pct(v,t){return t>0?Math.min(100,Math.round(v/t*100)):0;}

// Persistence
let userApiKey="";

async function loadData(){
  try{const r=await window.storage.get(storageKey("cra-v8"));if(r&&r.value){const p=JSON.parse(r.value);state.data={...state.data,...p};}}catch(e){console.log("loadData: no saved data yet or error:",e.message);}
  // Ensure all arrays exist (handles old backups missing new fields)
  if(!state.data.loans)state.data.loans=[];
  if(!state.data.invoices)state.data.invoices=[];
  if(!state.data.receipts)state.data.receipts=[];
  if(!state.data.receiptFolders)state.data.receiptFolders=["Uncategorized",...CRA_CATS];
  if(!state.data.vault)state.data.vault=[];
  if(!state.data.assets)state.data.assets=[];
  if(!state.data.logins)state.data.logins=[];
  if(!state.data.cards)state.data.cards=[];
  if(!state.data.secureNotes)state.data.secureNotes=[];
  if(!state.data.budgets)state.data.budgets={};
  if(!state.data.targets)state.data.targets={monthly:0,yearly:0};
  if(!state.data.taxShelters)state.data.taxShelters={tfsaRoom:7000,tfsaUsed:0,rrspRoom:0,rrspUsed:0,fhsaRoom:8000,fhsaUsed:0,fhsaEligible:true};
  try{const r=await window.storage.get(storageKey("cra-theme"));if(r&&r.value==="dark"){state.dark=true;document.documentElement.setAttribute("data-theme","dark");}}catch(e){}
  try{const r=await window.storage.get(storageKey("cra-apikey"));if(r&&r.value){userApiKey=r.value;}}catch(e){}
  
  // Load receipt images from split storage
  for(const receipt of state.data.receipts){
    if(receipt.imgKey&&!receipt.data){
      try{
        const r=await window.storage.get(storageKey(receipt.imgKey));
        if(r&&r.value)receipt.data=r.value;
      }catch(e){/* image not found in storage */}
    }
  }
  
  render();
}
let _saveWarned=false;
async function saveData(){
  try{
    // Split receipt images into separate storage keys (each up to 5MB)
    const receiptImages=[];
    const strippedReceipts=state.data.receipts.map(r=>{
      if(r.data&&r.data.length>1000){
        const imgKey="rimg-"+r.id;
        receiptImages.push({key:imgKey,data:r.data});
        return{...r,imgKey:imgKey,data:null};
      }
      return{...r};
    });
    
    // Save main data without image blobs
    const mainData={...state.data,receipts:strippedReceipts};
    await window.storage.set(storageKey("cra-v8"),JSON.stringify(mainData));
    
    // Save each receipt image in its own key
    for(const img of receiptImages){
      try{await window.storage.set(storageKey(img.key),img.data);}
      catch(e){console.error("Image save failed for "+img.key+":",e);}
    }
  }catch(e){
    console.error("saveData error:",e);
    if(!_saveWarned){
      _saveWarned=true;
      alert("Save error: "+e.message);
    }
  }
}

// Centralized AI call — uses user API key if set, falls back to artifact proxy
async function callAI(opts){
  const headers={"Content-Type":"application/json"};
  if(userApiKey){
    headers["x-api-key"]=userApiKey;
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }
  const body={model:opts.model||"claude-sonnet-4-20250514",max_tokens:opts.max_tokens||1000};
  if(opts.system)body.system=opts.system;
  if(opts.messages)body.messages=opts.messages;
  
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
  if(!resp.ok){
    const errText=await resp.text();
    throw new Error("API "+resp.status+": "+errText.substring(0,200));
  }
  return await resp.json();
}

function getFiltered(){
  let e=state.data.entries;
  // Tax year filter
  if(state.taxYear!=="all")e=e.filter(x=>x.date&&x.date.startsWith(state.taxYear));
  if(state.activeBiz!=="all")e=e.filter(x=>x.business===state.activeBiz);
  if(state.filterDateFrom)e=e.filter(x=>x.date>=state.filterDateFrom);
  if(state.filterDateTo)e=e.filter(x=>x.date<=state.filterDateTo);
  if(state.filterMonth!=="all"&&!state.filterDateFrom&&!state.filterDateTo)e=e.filter(x=>new Date(x.date).getMonth()===Number(state.filterMonth));
  if(state.filterFreq!=="all")e=e.filter(x=>(x.frequency||"one-time")===state.filterFreq);
  return e;
}

function getAllEntries(){
  let e=state.data.entries;
  if(state.taxYear!=="all")e=e.filter(x=>x.date&&x.date.startsWith(state.taxYear));
  if(state.activeBiz!=="all")e=e.filter(x=>x.business===state.activeBiz);
  return e;
}

function getStats(){
  const entries=getFiltered();
  const allE=getAllEntries();
  const sumT=(arr,t)=>arr.filter(e=>e.type===t).reduce((s,e)=>s+entryTotal(e),0);
  const tI=sumT(entries,"income"),tE=sumT(entries,"expense");
  const hC=entries.filter(e=>e.type==="income"&&e.hstMode&&e.hstMode!=="none").reduce((s,e)=>s+entryHST(e),0);
  const hP=entries.filter(e=>e.type==="expense"&&e.hstMode&&e.hstMode!=="none").reduce((s,e)=>s+entryHST(e),0);
  
  // Monthly recurring: deduplicate and only count ACTIVE (entry within last 45 days)
  const now=new Date();
  const monthlyEntries=allE.filter(e=>e.frequency==="monthly");
  const seen={};
  // Group by key, find most recent date for each
  const monthlyLatest={};
  monthlyEntries.forEach(e=>{
    const key=e.type+"|"+Math.round(Number(e.amount))+"|"+(e.description||e.category||e.serviceType)+"|"+e.business;
    const d=new Date(e.date);
    if(!monthlyLatest[key]||d>monthlyLatest[key].date){
      monthlyLatest[key]={date:d,entry:e};
    }
  });
  let mI=0,mE=0;
  Object.keys(monthlyLatest).forEach(key=>{
    const{date,entry}=monthlyLatest[key];
    const daysSince=Math.floor((now-date)/(1000*60*60*24));
    if(daysSince<=45){ // still active — paid within last 45 days
      if(entry.type==="income")mI+=entryTotal(entry);
      else mE+=entryTotal(entry);
    }
  });
  
  // Yearly recurring: deduplicate, only count if entry within last 13 months
  const yearlyEntries=allE.filter(e=>e.frequency==="yearly");
  const yearlyLatest={};
  yearlyEntries.forEach(e=>{
    const key=e.type+"|"+Math.round(Number(e.amount))+"|"+(e.description||e.category||e.serviceType)+"|"+e.business;
    const d=new Date(e.date);
    if(!yearlyLatest[key]||d>yearlyLatest[key].date){
      yearlyLatest[key]={date:d,entry:e};
    }
  });
  let yI=0,yE=0;
  Object.keys(yearlyLatest).forEach(key=>{
    const{date,entry}=yearlyLatest[key];
    const daysSince=Math.floor((now-date)/(1000*60*60*24));
    if(daysSince<=395){ // still active — paid within last ~13 months
      if(entry.type==="income")yI+=entryTotal(entry);
      else yE+=entryTotal(entry);
    }
  });
  
  const oI=sumT(allE.filter(e=>(e.frequency||"one-time")==="one-time"),"income");
  const oE=sumT(allE.filter(e=>(e.frequency||"one-time")==="one-time"),"expense");
  const aI=mI*12+yI+oI,aE=mE*12+yE+oE;
  let mils=state.data.mileage;
  if(state.taxYear!=="all")mils=mils.filter(m=>m.date&&m.date.startsWith(state.taxYear));
  if(state.activeBiz!=="all")mils=mils.filter(m=>m.business===state.activeBiz);
  const tKm=mils.reduce((s,m)=>s+Number(m.km),0);
  return{tI,tE,net:tI-tE,hC,hP,hO:hC-hP,mI,mE,oI,oE,aI,aE,aN:aI-aE,tKm,mD:tKm*0.70};
}

function getTax(){
  const st=getStats();
  // Use ACTUAL year-to-date net profit, not annualized projection
  const actualNet=st.tI-st.tE; // real income minus real expenses
  const deductions=st.mD+(state.data.homeOffice>0?st.tE*(state.data.homeOffice/100)*0.3:0);
  const txbl=Math.max(0,actualNet-deductions);
  const f=calcTax(txbl,FD_BR),p=calcTax(txbl,ON_BR),t=f+p;
  const corp=Math.min(txbl,500000)*0.122+Math.max(0,txbl-500000)*0.2653;
  // Also calculate projected full-year tax for forecasting
  const projNet=st.aN; // annualized net (for projection only)
  const projTxbl=Math.max(0,projNet-deductions);
  const projT=calcTax(projTxbl,FD_BR)+calcTax(projTxbl,ON_BR);
  return{txbl,f,p,t,eff:txbl>0?(t/txbl*100):0,after:txbl-t,corp,save:t-corp,projT,projTxbl};
}

function getCashFlowForecast(){
  const now=new Date();
  const periods=[30,60,90];
  const monthlyInc=getStats().mI;
  const monthlyExp=getStats().mE;
  const monthlyNet=monthlyInc-monthlyExp;
  
  const owedToMe=state.data.debts.filter(d=>d.direction==="owed_to_me"&&d.status==="unpaid");
  const iOwe=state.data.debts.filter(d=>d.direction==="i_owe"&&d.status==="unpaid");
  
  return periods.map(days=>{
    const futureDate=new Date(now.getTime()+days*24*60*60*1000);
    const monthsFwd=days/30;
    const recurringNet=monthlyNet*monthsFwd;
    const expectedIn=owedToMe.filter(d=>!d.dueDate||new Date(d.dueDate)<=futureDate).reduce((s,d)=>s+Number(d.amount),0);
    const expectedOut=iOwe.filter(d=>!d.dueDate||new Date(d.dueDate)<=futureDate).reduce((s,d)=>s+Number(d.amount),0);
    const projected=getStats().net+recurringNet+expectedIn-expectedOut;
    return{days,projected,recurringNet,expectedIn,expectedOut};
  });
}

    },0);
    if(unpaidSplits>0)alerts.push({icon:"●",msg:`${unpaidSplits} overdue payment split(s) — follow up on partial payments.`,t:"warn"});

  const softwareExp=allE.filter(e=>e.category==="Software / Digital Tools").reduce((s,e)=>s+Number(e.amount),0);

  if(noHst>5)opps.push({icon:"●",msg:`${noHst} expenses without HST marked. Mark them to claim 13% back!`});

  let maxScore=5,score=0;
  if(st.tKm>0)score++;if(state.data.homeOffice>0)score++;if(phoneExp>0)score++;if(noHst<allE.filter(e=>e.type==="expense").length*0.3)score++;if(state.data.assets.length>0)score++;
  const dedScore=Math.round(score/maxScore*100);
  
  // Low margin service warning
  const svcProfit=getServiceProfitability();
  const projects=state.data.projects||[];
  if(projects.length>=3){
    const svcMargins={};
    projects.forEach(p=>{
      const tc=p.costs.reduce((s,c)=>s+Number(c.amount),0);
      const margin=Number(p.revenue)>0?(Number(p.revenue)-tc)/Number(p.revenue)*100:0;

      svcMargins[p.serviceType].push(margin);
    });
    for(const[svc,margins]of Object.entries(svcMargins)){

      if(avg<30&&margins.length>=2)opps.push({icon:"●",msg:`${svc} avg margin is only ${Math.round(avg)}% — consider raising prices.`});
    }
  }
  
  return{alerts,opps,dedScore};
}

function getSafeToSpend(){
  const st=getStats();const tx=getTax();
  const netProfit=st.net; // actual income minus expenses
  const taxReserve=tx.t; // estimated tax on taxable income (already accounts for deductions)
  const hstReserve=Math.max(0,st.hO); // HST owing (ignore if refund)
  const hstRefund=st.hO<0?Math.abs(st.hO):0;
  const safe=netProfit-taxReserve-hstReserve+hstRefund;
  return{netProfit,taxReserve,hstReserve,hstRefund,safe};
}

function backfillMonthly(entry){
  if(entry.frequency!=="monthly"&&entry.frequency!=="yearly")return;
  const parts=(entry.date||"").split("-");
  if(parts.length<3)return;
  const startY=parseInt(parts[0]),startM=parseInt(parts[1])-1;
  const now=new Date();
  const nowY=now.getFullYear(),nowM=now.getMonth();
  
  if(entry.frequency==="monthly"){
    const months=(nowY-startY)*12+(nowM-startM);
    if(months<=0)return;
    
    const totalBack=months*Number(entry.amount);
    const msg=`This is monthly starting ${entry.date}. That's ${months} month${months>1?"s":""} ago.\n\nAdd entries for the past ${months} months?\n\n${months} × ${fmt(entry.amount)} = ${fmt(totalBack)}`;
    
    if(!confirm(msg))return;
    
    for(let i=1;i<=months;i++){
      const m=startM+i;
      const yr=startY+Math.floor(m/12);
      const mo=(m%12)+1;
      const dateStr=yr+"-"+String(mo).padStart(2,"0")+"-"+parts[2];
      // Mark as backfilled + one-time so it doesn't create duplicate recurring streams
      state.data.entries.push({...entry,id:uid(),date:dateStr,frequency:"one-time",backfilledFrom:entry.id});
    }
  } else if(entry.frequency==="yearly"){
    const years=nowY-startY;
    if(years<=0)return;
    if(!confirm(`This is yearly starting ${entry.date}. Add entries for the past ${years} year(s)?\n\n${years} × ${fmt(entry.amount)} = ${fmt(years*Number(entry.amount))}`))return;
    for(let i=1;i<=years;i++){
      const yr=startY+i;
      const dateStr=yr+"-"+parts[1]+"-"+parts[2];
      state.data.entries.push({...entry,id:uid(),date:dateStr,frequency:"one-time",backfilledFrom:entry.id});
    }
  }
}

function saveIncome(){
  const f=state.incF;if(!f.amount||Number(f.amount)<=0)return;
  const entry={...f,id:state.editId||uid(),type:"income",amount:Math.round(Number(f.amount)*100)/100};
  if(!state.editId&&checkDuplicate(entry)){if(!confirm("A similar entry exists (same amount, date, category). Add anyway?"))return;}
  if(state.editId){
    // Check if this is a recurring entry — offer bulk edit
    const oldEntry=state.data.entries.find(e=>e.id===state.editId);
    if(oldEntry&&(oldEntry.frequency==="monthly"||oldEntry.frequency==="yearly")){
      const siblings=state.data.entries.filter(e=>e.id!==state.editId&&e.frequency===oldEntry.frequency&&e.type===oldEntry.type&&Math.round(Number(e.amount))===Math.round(Number(oldEntry.amount))&&(e.description||e.category||e.serviceType)===(oldEntry.description||oldEntry.category||oldEntry.serviceType)&&e.business===oldEntry.business);
      if(siblings.length>0&&confirm("Update ALL "+siblings.length+" matching "+oldEntry.frequency+" entries with these changes?\n\n(Amount, description, category, business, HST will be updated. Dates stay the same.)")){
        siblings.forEach(sib=>{
          sib.amount=entry.amount;
          sib.description=entry.description;
          sib.serviceType=entry.serviceType;
          sib.client=entry.client;
          sib.business=entry.business;
          sib.hstMode=entry.hstMode;
          sib.paymentMethod=entry.paymentMethod;
          sib.paymentHow=entry.paymentHow;
          sib.category=entry.category;

    state.data.entries=state.data.entries.map(e=>e.id===state.editId?entry:e);

// Calculate months to pay off loan with interest
// Returns {months, totalInterest, totalPaid, monthlyBreakdown:[{month,payment,interest,principal,balance}]}
function calcLoanPayoff(balance,monthlyPayment,annualRate){
  if(balance<=0||monthlyPayment<=0)return{months:0,totalInterest:0,totalPaid:0,monthlyBreakdown:[]};
  const monthlyRate=annualRate/100/12;
  let remaining=balance;
  let months=0;
  let totalInterest=0;
  const breakdown=[];
  const maxMonths=600; // 50 year cap
  
  // Check if payment covers at least the interest
  if(monthlyRate>0){
    const minPayment=remaining*monthlyRate;
    if(monthlyPayment<=minPayment)return{months:-1,totalInterest:0,totalPaid:0,monthlyBreakdown:[],minPayment:Math.ceil(minPayment*100)/100};
  }
  
  while(remaining>0.01&&months<maxMonths){
    const interest=remaining*monthlyRate;
    const principal=Math.min(monthlyPayment-interest,remaining);
    remaining=remaining-principal;
    totalInterest+=interest;
    months++;
    if(breakdown.length<60)breakdown.push({month:months,payment:Math.min(monthlyPayment,principal+interest),interest,principal,balance:Math.max(0,remaining)});
  }
  return{months,totalInterest,totalPaid:balance+totalInterest,monthlyBreakdown:breakdown};
}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v);}
    else if(k.startsWith("on")){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="className"){el.className=v;}
    else if(k==="innerHTML"){el.innerHTML=v;}
    else{el.setAttribute(k,v);}
  }
  for(const child of children.flat(Infinity)){
    if(child==null||child===false)continue;
    if(typeof child==="string"||typeof child==="number")el.appendChild(document.createTextNode(String(child)));
    else if(child instanceof Node)el.appendChild(child);
  }
  return el;
}

// Create overlay that only closes on clean clicks — not when dragging to select text
function makeOverlay(onClose){
  let mouseDownTarget=null;
  const overlay=h("div",{className:"overlay"});
  overlay.addEventListener("mousedown",e=>{mouseDownTarget=e.target;});
  overlay.addEventListener("mouseup",e=>{
    // Only close if both mousedown AND mouseup happened on the overlay itself
    if(e.target===overlay&&mouseDownTarget===overlay){
      onClose();
    }
    mouseDownTarget=null;
  });
  return overlay;
}

    });
    
    // Verdict
    const verdict=hourlyRate>100?"● Great job — take it!":hourlyRate>50?"● Decent — worth it if schedule allows":hourlyRate>25?"● Tight margins — negotiate higher":"● Not worth your time — pass or renegotiate";
    resultCard.appendChild(h("div",{style:{marginTop:"14px",padding:"12px",background:"var(--statBg)",borderRadius:"8px",fontSize:"13px",fontWeight:600,color:"var(--gold)",textAlign:"center"}},verdict));
    
    // Suggested pricing
    if(totalCost>0){
      resultCard.appendChild(h("div",{style:{marginTop:"14px",borderTop:"1px solid var(--border)",paddingTop:"14px"}}));
      resultCard.appendChild(h("div",{style:{fontSize:"12px",fontWeight:700,marginBottom:"8px"}},"Suggested Pricing"));
      [{label:"Break-Even (0% margin)",margin:0},{label:"Minimum (30% margin)",margin:30},{label:"Healthy (50% margin)",margin:50},{label:"Premium (70% margin)",margin:70}].forEach(t=>{
        const suggested=totalCost/(1-t.margin/100);
        resultCard.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",padding:"4px 0"}},
          h("span",{style:{color:"var(--dim)"}},t.label),
          h("span",{className:"mn",style:{fontWeight:600,color:t.margin>=50?"var(--pg)":t.margin>=30?"var(--py)":"var(--pr)"}},fmt(suggested))
        ));
      });
    }
  } else {
    resultCard.appendChild(h("p",{style:{color:"var(--dark)",textAlign:"center",padding:"30px"}},"Enter a job price to see the breakdown."));
  }
  grid.appendChild(resultCard);
  els.push(grid);
  return els;
}

function renderLedger(){
  const debts=state.activeBiz==="all"?state.data.debts:state.data.debts.filter(d=>d.business===state.activeBiz);
  const owedToMe=debts.filter(d=>d.direction==="owed_to_me");
  const iOwe=debts.filter(d=>d.direction==="i_owe");
  const owedUnpaid=owedToMe.filter(d=>d.status==="unpaid").reduce((s,d)=>s+Number(d.amount),0);
  const oweUnpaid=iOwe.filter(d=>d.status==="unpaid").reduce((s,d)=>s+Number(d.amount),0);

        h("button",{style:{background:"none",border:"none",cursor:"pointer",color:"#4a3020",fontSize:"13px"},onClick:()=>{safeDelete("debt",d.id);}},"🗑")

  loanHeader.appendChild(h("button",{className:"btn",style:{fontSize:"11px",padding:"5px 14px",background:"var(--pb)",color:"#fff"},onClick:()=>{
    state.editId=null;

  loanSection.appendChild(loanHeader);

  } else {
    loans.forEach(loan=>{
      const balance=getLoanBalance(loan);
      const totalPaid=(loan.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
      const pct=loan.totalAmount>0?Math.min(100,Math.round(totalPaid/loan.totalAmount*100)):0;
      const biz=state.data.businesses.find(b=>b.id===loan.business);
      const payCount=(loan.payments||[]).length;

      const lCard=h("div",{className:"card",style:{marginBottom:"10px"}});
      
      // Top row: name + amount
      const topRow=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"8px"}});
      topRow.appendChild(h("div",{},
        h("div",{style:{fontSize:"14px",fontWeight:700,color:"var(--cream)"}},loan.name+(rate>0?" • "+rate+"% interest":"")),
        h("div",{style:{fontSize:"11px",color:"var(--dim)",marginTop:"2px"}},"Through: "+loan.person+(biz?" • "+biz.icon+" "+biz.name:"")+(loan.notes?" • "+loan.notes:""))
      ));
      topRow.appendChild(h("div",{style:{textAlign:"right"}},
        h("div",{className:"mn",style:{fontWeight:700,color:balance<=0?"var(--pg)":"var(--pb)",fontSize:"15px"}},balance<=0?"Paid Off":fmt(balance)+" left"),
        h("div",{style:{fontSize:"11px",color:"var(--dim)"}},fmt(totalPaid)+" / "+fmt(loan.totalAmount)+" paid")
      ));
      lCard.appendChild(topRow);
      
      // Progress bar
      const barBg=h("div",{style:{height:"8px",borderRadius:"4px",background:"var(--border)",overflow:"hidden",marginBottom:"10px"}});
      barBg.appendChild(h("div",{style:{height:"100%",width:pct+"%",borderRadius:"4px",background:balance<=0?"var(--pg)":"var(--pb)",transition:"width .3s"}}));
      lCard.appendChild(barBg);
      
      // Info row
      const infoRow=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:"11px",color:"var(--dim)",marginBottom:"10px"}});
      infoRow.appendChild(h("span",{},pct+"% paid • "+payCount+" payment"+(payCount!==1?"s":"")+(loan.monthlyPayment?" • "+fmt(loan.monthlyPayment)+"/mo":"")));
      if(lastPay)infoRow.appendChild(h("span",{},"Last payment: "+lastPay.date));
      else infoRow.appendChild(h("span",{},"Started: "+loan.startDate));
      lCard.appendChild(infoRow);
      
      // ── PAYOFF CALCULATOR ──
      if(balance>0&&loan.monthlyPayment>0){
        const payoff=calcLoanPayoff(balance,loan.monthlyPayment,rate);
        const calcBox=h("div",{style:{background:"var(--bg)",borderRadius:"8px",padding:"12px",marginBottom:"10px",border:"1px solid var(--border)"}});
        
        if(payoff.months===-1){
          // Payment doesn't cover interest
          calcBox.appendChild(h("div",{style:{fontSize:"12px",color:"var(--pr)",fontWeight:600}},"⚠ Monthly payment of "+fmt(loan.monthlyPayment)+" doesn't cover interest. Minimum payment needed: "+fmt(payoff.minPayment)));
        } else {
          const years=Math.floor(payoff.months/12);
          const mos=payoff.months%12;
          const timeStr=years>0?(years+" yr"+(years>1?"s":"")+(mos>0?" "+mos+" mo":"")):(mos+" mo"+(mos!==1?"s":""));
          
          // Payoff date
          const payoffDate=new Date();
          payoffDate.setMonth(payoffDate.getMonth()+payoff.months);
          const payoffStr=payoffDate.toLocaleDateString("en-CA",{year:"numeric",month:"short"});
          
          const row1=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"6px"}});
          row1.appendChild(h("span",{style:{color:"var(--dim)"}},"Payoff at "+fmt(loan.monthlyPayment)+"/mo:"));
          row1.appendChild(h("span",{style:{fontWeight:700,color:"var(--pb)"}},timeStr+" ("+payoffStr+")"));
          calcBox.appendChild(row1);
          
          if(rate>0){
            const row2=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"6px"}});
            row2.appendChild(h("span",{style:{color:"var(--dim)"}},"Total interest you'll pay:"));
            row2.appendChild(h("span",{style:{fontWeight:700,color:"var(--pr)"}},fmt(payoff.totalInterest)));
            calcBox.appendChild(row2);
            
            const row3=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px"}});
            row3.appendChild(h("span",{style:{color:"var(--dim)"}},"Total cost (principal + interest):"));
            row3.appendChild(h("span",{style:{fontWeight:700,color:"var(--cream)"}},fmt(payoff.totalPaid)));
            calcBox.appendChild(row3);
          }
        }
        lCard.appendChild(calcBox);
        
        // ── WHAT-IF: PAY MORE ──
        const whatIfKey="loanWhatIf_"+loan.id;
        const showWhatIf=state[whatIfKey+"_show"];
        
        const whatIfBtn=h("button",{className:"btn btn-ghost",style:{fontSize:"11px",padding:"4px 10px",marginBottom:showWhatIf?"8px":"0",color:"var(--gold)"},onClick:()=>{
          state[whatIfKey+"_show"]=!state[whatIfKey+"_show"];
          if(!state[whatIfKey])state[whatIfKey]=String(Math.round(loan.monthlyPayment*1.25));
          render();
        }},showWhatIf?"▾ Hide What-If":"▸ What if I pay more?");
        lCard.appendChild(whatIfBtn);
        
        if(showWhatIf){
          const whatIfBox=h("div",{style:{background:"var(--gold)08",borderRadius:"8px",padding:"12px",marginBottom:"10px",border:"1px solid var(--gold)33"}});
          whatIfBox.appendChild(h("div",{style:{fontSize:"12px",fontWeight:600,color:"var(--gold)",marginBottom:"8px"}},"What-If Calculator"));
          
          // Slider + input
          const extraAmt=Number(state[whatIfKey]||Math.round(loan.monthlyPayment*1.25));
          const sliderRow=h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}});
          sliderRow.appendChild(h("span",{style:{fontSize:"11px",color:"var(--dim)",whiteSpace:"nowrap"}},"If I pay:"));
          
          const slider=document.createElement("input");
          slider.type="range";
          slider.min=String(Math.max(1,Math.ceil(loan.monthlyPayment)));
          slider.max=String(Math.round(loan.monthlyPayment*4));
          slider.value=String(extraAmt);
          slider.style.cssText="flex:1;accent-color:var(--gold);cursor:pointer;";
          slider.addEventListener("input",(e)=>{state[whatIfKey]=e.target.value;render();});
          sliderRow.appendChild(slider);
          
          const amtInput=document.createElement("input");
          amtInput.type="number";
          amtInput.value=String(extraAmt);
          amtInput.style.cssText="width:80px;padding:4px 6px;font-size:12px;font-family:'JetBrains Mono',monospace;text-align:right;background:var(--inputBg);border:1px solid var(--border);border-radius:5px;color:var(--cream);";
          amtInput.addEventListener("change",(e)=>{state[whatIfKey]=e.target.value;render();});
          sliderRow.appendChild(amtInput);
          sliderRow.appendChild(h("span",{style:{fontSize:"11px",color:"var(--dim)"}},"/mo"));
          whatIfBox.appendChild(sliderRow);
          
          // Calculate what-if
          const whatIfPayoff=calcLoanPayoff(balance,extraAmt,rate);
          const origPayoff=payoff.months>0?payoff:calcLoanPayoff(balance,loan.monthlyPayment,rate);
          
          if(whatIfPayoff.months===-1){
            whatIfBox.appendChild(h("div",{style:{fontSize:"12px",color:"var(--pr)"}},"Still not enough to cover interest."));
          } else if(origPayoff.months>0){
            const savedMonths=origPayoff.months-whatIfPayoff.months;
            const savedInterest=origPayoff.totalInterest-whatIfPayoff.totalInterest;
            
            const wYears=Math.floor(whatIfPayoff.months/12);
            const wMos=whatIfPayoff.months%12;
            const wTimeStr=wYears>0?(wYears+" yr"+(wYears>1?"s":"")+(wMos>0?" "+wMos+" mo":"")):(wMos+" mo"+(wMos!==1?"s":""));
            
            const wDate=new Date();
            wDate.setMonth(wDate.getMonth()+whatIfPayoff.months);
            const wDateStr=wDate.toLocaleDateString("en-CA",{year:"numeric",month:"short"});
            
            const r1=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"4px"}});
            r1.appendChild(h("span",{style:{color:"var(--dim)"}},"Paid off in:"));
            r1.appendChild(h("span",{style:{fontWeight:700,color:"var(--pg)"}},wTimeStr+" ("+wDateStr+")"));
            whatIfBox.appendChild(r1);
            
            if(savedMonths>0){
              const r2=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"4px"}});
              r2.appendChild(h("span",{style:{color:"var(--dim)"}},"Time saved:"));
              const sY=Math.floor(savedMonths/12);const sM=savedMonths%12;
              const sStr=sY>0?(sY+" yr"+(sY>1?"s":"")+(sM>0?" "+sM+" mo":"")):(sM+" mo"+(sM!==1?"s":""));
              r2.appendChild(h("span",{style:{fontWeight:700,color:"var(--pg)"}},sStr+" faster"));
              whatIfBox.appendChild(r2);
            }
            
            if(rate>0&&savedInterest>0){
              const r3=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"4px"}});
              r3.appendChild(h("span",{style:{color:"var(--dim)"}},"Interest saved:"));
              r3.appendChild(h("span",{style:{fontWeight:700,color:"var(--pg)"}},fmt(savedInterest)));
              whatIfBox.appendChild(r3);
              
              const r4=h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px"}});
              r4.appendChild(h("span",{style:{color:"var(--dim)"}},"Total interest at "+fmt(extraAmt)+"/mo:"));
              r4.appendChild(h("span",{style:{fontWeight:700,color:"var(--pr)"}},fmt(whatIfPayoff.totalInterest)+" (vs "+fmt(origPayoff.totalInterest)+")"));
              whatIfBox.appendChild(r4);
            }
            
            if(extraAmt>loan.monthlyPayment){
              const extra=extraAmt-loan.monthlyPayment;
              whatIfBox.appendChild(h("div",{style:{fontSize:"11px",color:"var(--gold)",marginTop:"8px",fontStyle:"italic"}},"That's "+fmt(extra)+" extra per month — "+fmt(extra*12)+" more per year."));
            }
          }
          lCard.appendChild(whatIfBox);
        }
      }
      
      // Action buttons
      const btnRow=h("div",{style:{display:"flex",gap:"6px"}});
      if(balance>0){
        btnRow.appendChild(h("button",{className:"btn",style:{fontSize:"11px",padding:"5px 14px",background:"var(--pb)",color:"#fff"},onClick:()=>{
          state.loanPaymentId=loan.id;
          state.loanPayF={date:today(),amount:String(loan.monthlyPayment||""),note:""};
          state.modal="loan_payment";render();
        }},"+ Log Payment"));
      }
      btnRow.appendChild(h("button",{className:"btn btn-ghost",style:{fontSize:"11px",padding:"5px 10px"},onClick:()=>{
        state.loanPaymentId=loan.id;
        state.loanPayF=null;
        state.modal="loan_payment";render();
      }},"History ("+payCount+")"));
      btnRow.appendChild(h("button",{style:{background:"none",border:"none",cursor:"pointer",color:"var(--dim)",fontSize:"13px"},onClick:()=>{
        state.editId=loan.id;
        state.loanF={name:loan.name,person:loan.person,totalAmount:String(loan.totalAmount),monthlyPayment:String(loan.monthlyPayment||""),interestRate:String(loan.interestRate||""),startDate:loan.startDate||today(),business:loan.business||"b1",notes:loan.notes||""};
        state.modal="loan";render();
      }},"✎"));
      btnRow.appendChild(h("button",{style:{background:"none",border:"none",cursor:"pointer",color:"#4a3020",fontSize:"13px"},onClick:()=>{
        if(confirm("Delete loan \""+loan.name+"\" and all its payment history?"))deleteLoan(loan.id);
      }},"🗑"));
      lCard.appendChild(btnRow);
      
      loanSection.appendChild(lCard);
    });
  }
  els.push(loanSection);
  
  return els;
}

function renderRecurring(){
  const st=getStats();const allE=getAllEntries();
  const els=[];
  const stats=h("div",{className:"grid-3 mb-18"});
  stats.appendChild(statCard("Monthly Net",fmt(st.mI-st.mE),st.mI-st.mE>=0?"var(--pg)":"var(--pr)"));
  stats.appendChild(statCard("Recurring Income",fmt(st.mI),"var(--pg)"));
  stats.appendChild(statCard("Recurring Expenses",fmt(st.mE),"var(--pr)"));
  els.push(stats);
  
  const grid=h("div",{className:"grid-2"});
  const now2=new Date();
  ["income","expense"].forEach(type=>{
    // Deduplicate monthly by key, find latest date
    const monthlyAll=allE.filter(e=>e.frequency==="monthly"&&e.type===type);
    const mGroups={};
    monthlyAll.forEach(e=>{
      const key=Math.round(Number(e.amount))+"|"+(e.description||e.category||e.serviceType)+"|"+e.business;
      const d=new Date(e.date);
      if(!mGroups[key]||d>mGroups[key].date)mGroups[key]={date:d,entry:e};
    });
    const monthlyItems=Object.values(mGroups).sort((a,b)=>Number(b.entry.amount)-Number(a.entry.amount));
    
    // Deduplicate yearly
    const yearlyAll=allE.filter(e=>e.frequency==="yearly"&&e.type===type);
    const yGroups={};
    yearlyAll.forEach(e=>{
      const key=Math.round(Number(e.amount))+"|"+(e.description||e.category||e.serviceType)+"|"+e.business;
      const d=new Date(e.date);
      if(!yGroups[key]||d>yGroups[key].date)yGroups[key]={date:d,entry:e};
    });
    const yearlyItems=Object.values(yGroups).sort((a,b)=>Number(b.entry.amount)-Number(a.entry.amount));
    
    const card=h("div",{className:"card"});
    
    // Monthly section
    const activeMonthly=monthlyItems.filter(g=>Math.floor((now2-g.date)/(1000*60*60*24))<=45);
    const staleMonthly=monthlyItems.filter(g=>Math.floor((now2-g.date)/(1000*60*60*24))>45);
    
    card.appendChild(h("h3",{style:{fontSize:"13px",fontWeight:700,color:type==="income"?"var(--pg)":"var(--pr)",marginBottom:"12px"}},"Monthly "+(type==="income"?"Income":"Expenses")+" ("+activeMonthly.length+" active)"));
    if(activeMonthly.length===0&&staleMonthly.length===0)card.appendChild(h("p",{style:{color:"var(--dark)",fontSize:"12px",marginBottom:"12px"}},"None yet."));
    
    const renderRecItem=(g,freq,stale)=>{
      const e=g.entry;const biz=getBiz(e.business);
      const daysSince=Math.floor((now2-g.date)/(1000*60*60*24));
      const row=h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)",opacity:stale?"0.5":"1"}});
      const left=h("div",{});
      left.appendChild(h("div",{style:{fontSize:"12px",fontWeight:500,display:"flex",alignItems:"center",gap:"6px"}},
        e.description||e.category||e.serviceType,
        stale?h("span",{style:{fontSize:"8px",padding:"2px 6px",borderRadius:"4px",background:"#c8787822",color:"#c87878",fontWeight:700}},"STALE — "+daysSince+"d ago"):null
      ));
      left.appendChild(h("div",{style:{fontSize:"10px",color:"var(--dark)"}},biz?biz.icon+" "+biz.name:""));
      row.appendChild(left);
      if(freq==="monthly"){
        row.appendChild(h("div",{style:{textAlign:"right"}},h("div",{className:"mn",style:{fontWeight:600,color:stale?"var(--dim)":type==="income"?"var(--pg)":"var(--pr)",fontSize:"13px"}},fmt(e.amount)+"/mo"),h("div",{className:"mn",style:{color:"var(--dark)",fontSize:"10px"}},fmt(e.amount*12)+"/yr")));
      } else {
        row.appendChild(h("div",{style:{textAlign:"right"}},h("div",{className:"mn",style:{fontWeight:600,color:stale?"var(--dim)":type==="income"?"var(--pg)":"var(--pr)",fontSize:"13px"}},fmt(e.amount)+"/yr"),h("div",{className:"mn",style:{color:"var(--dark)",fontSize:"10px"}},fmt(e.amount/12)+"/mo")));
      }
      card.appendChild(row);
    };
    
    activeMonthly.forEach(g=>renderRecItem(g,"monthly",false));
    if(staleMonthly.length>0){
      card.appendChild(h("div",{style:{fontSize:"10px",color:"var(--dim)",marginTop:"10px",marginBottom:"6px",fontWeight:600}},"Inactive (not paid in 45+ days):"));
      staleMonthly.forEach(g=>renderRecItem(g,"monthly",true));
    }
    
    // Yearly section
    if(yearlyItems.length>0){
      const activeYearly=yearlyItems.filter(g=>Math.floor((now2-g.date)/(1000*60*60*24))<=395);
      const staleYearly=yearlyItems.filter(g=>Math.floor((now2-g.date)/(1000*60*60*24))>395);
      
      card.appendChild(h("h3",{style:{fontSize:"13px",fontWeight:700,color:type==="income"?"var(--pg)":"var(--pr)",marginTop:"16px",marginBottom:"12px"}},"Yearly "+(type==="income"?"Income":"Expenses")+" ("+activeYearly.length+" active)"));
      activeYearly.forEach(g=>renderRecItem(g,"yearly",false));
      if(staleYearly.length>0){
        card.appendChild(h("div",{style:{fontSize:"10px",color:"var(--dim)",marginTop:"10px",marginBottom:"6px",fontWeight:600}},"Inactive (not paid in 13+ months):"));
        staleYearly.forEach(g=>renderRecItem(g,"yearly",true));
      }
    }
    
    grid.appendChild(card);
  });
  els.push(grid);
  return els;
}

function renderMileage(){
  const st=getStats();

  if(state.taxYear!=="all")mils=mils.filter(m=>m.date&&m.date.startsWith(state.taxYear));
  if(state.activeBiz!=="all")mils=mils.filter(m=>m.business===state.activeBiz);
  const els=[];
  const stats=h("div",{className:"grid-3 mb-18"});
  stats.appendChild(statCard("Total KM",st.tKm.toLocaleString(),"var(--pb)"));
  stats.appendChild(statCard("Deduction",fmt(st.mD),"var(--pg)"));
  stats.appendChild(statCard("Drives",mils.length.toString(),"var(--py)"));

  if(mils.length===0)card.appendChild(h("p",{style:{color:"var(--dark)",textAlign:"center",padding:"20px"}},"No drives logged."));
  else mils.sort((a,b)=>b.date.localeCompare(a.date)).forEach(m=>{
    const biz=getBiz(m.business);
    card.appendChild(h("div",{className:"row"},
      h("div",{},h("div",{style:{fontSize:"13px",fontWeight:500}},m.from&&m.to?m.from+" → "+m.to:m.purpose||"Drive"),h("div",{style:{fontSize:"11px",color:"var(--dark)"}},(biz?biz.icon+" "+biz.name:"")+" • "+m.date)),

function renderCategories(){
  const cats=getCatBreakdown();
  const now=new Date();const monthNow=now.getMonth();
  const budgets=state.data.budgets||{};
  const els=[];
  
  els.push(h("p",{style:{color:"var(--dim)",fontSize:"13px",marginBottom:"16px"}},"Expense breakdown by CRA category. Set monthly budgets to track spending limits."));
  
  // Budget warnings at top
  const warnings=getBudgetStatus().filter(b=>b.pct>=80);
  if(warnings.length>0){
    const warnBox=h("div",{style:{marginBottom:"16px"}});
    warnings.forEach(w=>{
      warnBox.appendChild(h("div",{style:{padding:"10px 14px",background:w.over?"var(--pr)12":"var(--po)12",border:`1px solid ${w.over?"var(--pr)":"var(--po)"}33`,borderRadius:"8px",marginBottom:"6px",fontSize:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("span",{style:{color:w.over?"var(--pr)":"var(--po)",fontWeight:600}},(w.over?"Over budget: ":"Approaching limit: ")+w.cat),
        h("span",{className:"mn",style:{fontWeight:700,color:w.over?"var(--pr)":"var(--po)"}},fmt(w.spent)+" / "+fmt(w.limit)+" ("+w.pct+"%)")
      ));
    });
    els.push(warnBox);
  }
  
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"12px"}});
  cats.forEach(([cat,v])=>{
    const budget=budgets[cat]||0;
    const monthSpent=state.data.entries.filter(e=>e.type==="expense"&&e.category===cat&&new Date(e.date).getMonth()===monthNow).reduce((s,e)=>s+Number(e.amount),0);
    const budgetPct=budget>0?Math.min(100,Math.round(monthSpent/budget*100)):0;
    const overBudget=budget>0&&monthSpent>budget;
    
    const card=h("div",{className:"card",style:{padding:"18px",borderLeft:overBudget?"3px solid var(--pr)":""}});
    card.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},
      h("div",{style:{fontSize:"13px",fontWeight:600}},cat),
      h("button",{style:{background:"none",border:"1px solid var(--border)",borderRadius:"5px",padding:"2px 8px",fontSize:"10px",color:"var(--dim)",cursor:"pointer",fontFamily:"'Outfit',sans-serif"},onClick:()=>{
        const v=prompt("Monthly budget for "+cat+" ($):",budget||"");
        if(v!==null){if(!state.data.budgets)state.data.budgets={};state.data.budgets[cat]=Number(v)||0;saveData();render();}
      }},budget>0?"Budget: "+fmt(budget):"Set Budget")
    ));
    card.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px"}},h("span",{style:{color:"var(--dim)"}},"Total"),h("span",{className:"mn",style:{color:"var(--pr)",fontWeight:600}},fmt(v.t))));
    if(v.m>0)card.appendChild(h("div",{style:{fontSize:"11px",color:"var(--pb)",marginTop:"4px"}},""+fmt(v.m)+"/mo"));
    if(v.o>0)card.appendChild(h("div",{style:{fontSize:"11px",color:"var(--py)",marginTop:"2px"}},""+fmt(v.o)+" one-time"));
    
    // Budget progress bar
    if(budget>0){
      card.appendChild(h("div",{style:{marginTop:"8px"}}));
      card.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"10px",marginBottom:"4px"}},
        h("span",{style:{color:"var(--dim)"}},"This month"),
        h("span",{className:"mn",style:{color:overBudget?"var(--pr)":budgetPct>=80?"var(--po)":"var(--pg)",fontWeight:600}},fmt(monthSpent)+" / "+fmt(budget))
      ));
      const bar=h("div",{style:{height:"6px",borderRadius:"3px",background:"var(--border)",overflow:"hidden"}});
      bar.appendChild(h("div",{style:{height:"100%",borderRadius:"3px",width:Math.min(100,budgetPct)+"%",background:overBudget?"var(--pr)":budgetPct>=80?"var(--po)":"var(--pg)",transition:"width .5s"}}));
      card.appendChild(bar);
    }
    
    if(cat==="Meals & Entertainment")card.appendChild(h("div",{style:{marginTop:"6px",padding:"4px 8px",background:"var(--statBg)",borderRadius:"5px",fontSize:"10px",color:"var(--po)"}},"50% deductible = "+fmt(v.t*0.5)));
    grid.appendChild(card);
  });
  if(cats.length===0)grid.appendChild(h("div",{className:"card",style:{textAlign:"center",color:"var(--dark)",padding:"30px"}},"Add expenses to see breakdowns."));
  els.push(grid);
  return els;
}

function renderSavingsCalc(){
  const els=[];
  const tx=getTax();
  const income=tx.txbl;
  // Determine marginal rate
  let marginalRate=0.2005;
  if(income>220000)marginalRate=0.5353;
  else if(income>150000)marginalRate=0.4916;
  else if(income>102894)marginalRate=0.4341;
  else if(income>55867)marginalRate=0.2965;
  else if(income>51446)marginalRate=0.2915;
  
  els.push(h("p",{style:{color:"var(--dim)",fontSize:"13px",marginBottom:"18px"}},"Based on your income, here's exactly where to put your money and why."));
  
  // Your bracket
  const bracketCard=h("div",{className:"card mb-18",style:{borderLeft:"3px solid var(--gold)"}});
  bracketCard.appendChild(h("div",{style:{fontSize:"13px",fontWeight:700,color:"var(--gold)",marginBottom:"10px",display:"flex",alignItems:"center",gap:"6px"}},icon("ac03",18),"Your Tax Profile"));
  [{l:"Estimated Taxable Income",v:fmt(income),c:"var(--pp)"},{l:"Marginal Tax Rate",v:(marginalRate*100).toFixed(1)+"%",c:"var(--po)"},{l:"Every $1 deduction saves you",v:fmt(marginalRate),c:"var(--pg)"}].forEach(r=>{
    bracketCard.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)",fontSize:"13px"}},h("span",{style:{color:"var(--muted)"}},r.l),h("span",{className:"mn",style:{fontWeight:700,color:r.c}},r.v)));
  });
  els.push(bracketCard);
  
  // Recommendation
  const recCard=h("div",{className:"card mb-18",style:{background:"var(--statBg)"}});
  recCard.appendChild(h("h3",{style:{fontSize:"15px",fontWeight:700,marginBottom:"12px",display:"flex",alignItems:"center",gap:"6px"}},icon("coaching_finance_business_live",18),"Recommended Strategy"));
  if(marginalRate>=0.30){
    recCard.appendChild(h("div",{style:{fontSize:"13px",color:"var(--cream)",lineHeight:1.8}},
      h("div",{style:{marginBottom:"8px"}},"Your marginal rate is "+Math.round(marginalRate*100)+"% — here's the optimal order:"),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--pg)"}},h("strong",{},"1. Max RRSP first")," — Every $1 saves you "+fmt(marginalRate)+". A $10K contribution = "+fmt(10000*marginalRate)+" tax refund."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--pb)"}},h("strong",{},"2. Put RRSP refund into TFSA")," — The "+fmt(10000*marginalRate)+" refund grows tax-free forever in TFSA."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--pp)"}},h("strong",{},"3. FHSA if first-time buyer")," — $8K/yr deductible AND tax-free withdrawal. Best of both worlds."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",borderLeft:"3px solid var(--py)"}},h("strong",{},"4. RESP if you have kids")," — $2,500/yr gets $500 FREE from government (20% match).")
    ));
  } else {
    recCard.appendChild(h("div",{style:{fontSize:"13px",color:"var(--cream)",lineHeight:1.8}},
      h("div",{style:{marginBottom:"8px"}},"Your marginal rate is "+Math.round(marginalRate*100)+"% — TFSA is better for you right now:"),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--pg)"}},h("strong",{},"1. Max TFSA first ($7K)")," — Growth is tax-free. No benefit to RRSP deduction at your rate."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--pp)"}},h("strong",{},"2. FHSA if first-time buyer")," — Even at low income, the deduction helps."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",marginBottom:"6px",borderLeft:"3px solid var(--py)"}},h("strong",{},"3. RESP if you have kids")," — Free $500/yr from government."),
      h("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderRadius:"8px",borderLeft:"3px solid var(--pb)"}},h("strong",{},"4. RRSP last")," — Save RRSP room for when your income is higher.")
    ));
  }
  els.push(recCard);
  
  // Account comparison table
  const tableCard=h("div",{className:"card mb-18"});
  tableCard.appendChild(h("h3",{style:{fontSize:"14px",fontWeight:600,marginBottom:"12px",display:"flex",alignItems:"center",gap:"6px"}},icon("balance_documents_financial_bank",18),"Account Comparison"));
  const thead=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 100px",gap:"8px",padding:"8px 0",borderBottom:"2px solid var(--border)",fontSize:"10px",fontWeight:700,color:"var(--dim)",textTransform:"uppercase"}});
  ["Account","Limit/yr","Tax Refund","Growth"].forEach(c=>thead.appendChild(h("span",{},c)));
  tableCard.appendChild(thead);
  [
    {name:"TFSA",limit:"$7,000",refund:"None",growth:"Tax-free forever",c:"var(--pg)"},
    {name:"RRSP",limit:fmt(Math.min(income*0.18,31560)),refund:fmt(Math.min(income*0.18,31560)*marginalRate),growth:"Taxed on withdrawal",c:"var(--pb)"},
    {name:"FHSA",limit:"$8,000",refund:fmt(8000*marginalRate),growth:"Tax-free for home",c:"var(--pp)"},
    {name:"RESP",limit:"$2,500",refund:"$500 CESG",growth:"Tax-sheltered",c:"var(--py)"},
  ].forEach(r=>{
    const row=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 100px",gap:"8px",padding:"10px 0",borderBottom:"1px solid var(--border)",fontSize:"12px",alignItems:"center"}});
    row.appendChild(h("span",{style:{fontWeight:600,color:r.c}},r.name));
    row.appendChild(h("span",{className:"mn",style:{fontSize:"11px"}},r.limit));
    row.appendChild(h("span",{className:"mn",style:{fontSize:"11px",color:"var(--pg)"}},r.refund));
    row.appendChild(h("span",{style:{fontSize:"11px",color:"var(--dim)"}},r.growth));
    tableCard.appendChild(row);
  });
  els.push(tableCard);
  return els;
}

function buildPayload(){
  const st=getStats();const tx=getTax();const safe=getSafeToSpend();
  const bizStats=getBizStats();const forecast=getCashFlowForecast();
  const svcProfit=getServiceProfitability();const catBr=getCatBreakdown();
  const projects=state.data.projects||[];const debts=state.data.debts||[];
  const recurring=state.data.entries.filter(e=>e.frequency==="monthly");
  const unpaidOwed=debts.filter(d=>d.direction==="owed_to_me"&&d.status==="unpaid");
  const iOwe=debts.filter(d=>d.direction==="i_owe"&&d.status==="unpaid");
  const now=new Date();const monthNow=now.getMonth();
  
  return {
    month: MONTHS[monthNow]+" "+now.getFullYear(),
    total_income_all_time: Math.round(st.tI),
    total_expenses_all_time: Math.round(st.tE),
    net_profit_all_time: Math.round(st.net),
    one_time_income: Math.round(st.oI),
    one_time_expenses: Math.round(st.oE),
    recurring_monthly_income: Math.round(st.mI),
    recurring_monthly_expenses: Math.round(st.mE),
    recurring_monthly_net: Math.round(st.mI-st.mE),
    note_on_totals: "total_income/expenses includes BOTH one-time and recurring. Only recurring_monthly amounts repeat each month. Do NOT treat one-time entries as monthly burn.",
    annual_projected: {income:Math.round(st.aI),expenses:Math.round(st.aE),profit:Math.round(st.aN),formula:"(monthly×12)+one_time"},
    tax: {taxable:Math.round(tx.txbl),federal:Math.round(tx.f),ontario:Math.round(tx.p),total:Math.round(tx.t),effective_rate:tx.eff.toFixed(1)+"%",after_tax:Math.round(tx.after),if_incorporated:Math.round(tx.corp),incorporation_savings:Math.round(tx.save)},
    hst: {collected:Math.round(st.hC),paid:Math.round(st.hP),owing:Math.round(st.hO)},
    safe_to_spend: Math.round(safe.safe),
    businesses: bizStats.map(b=>({name:b.name,registered:b.registered,revenue:Math.round(b.inc),expenses:Math.round(b.exp),profit:Math.round(b.net)})),
    service_profitability: svcProfit.slice(0,8).map(([svc,d])=>({service:svc,revenue:Math.round(d.revenue),jobs:d.count,avg_per_job:Math.round(d.count>0?d.revenue/d.count:0)})),
    recent_projects: projects.slice(-5).map(p=>{const tc=p.costs.reduce((s,c)=>s+Number(c.amount),0);return{name:p.name,service:p.serviceType,revenue:Math.round(p.revenue),costs:Math.round(tc),profit:Math.round(p.revenue-tc),margin:p.revenue>0?Math.round((p.revenue-tc)/p.revenue*100)+"%":"0%"};}),
    top_expense_categories: catBr.slice(0,8).map(([cat,v])=>({category:cat,amount:Math.round(v.t)})),
    cash_flow_forecast: forecast.map(f=>({days:f.days,projected:Math.round(f.projected)})),
    debts: {owed_to_me:{total:Math.round(unpaidOwed.reduce((s,d)=>s+Number(d.amount),0)),count:unpaidOwed.length},i_owe:{total:Math.round(iOwe.reduce((s,d)=>s+Number(d.amount),0)),count:iOwe.length}},
    deductions: {mileage_km:st.tKm,mileage_value:Math.round(st.mD),home_office_pct:state.data.homeOffice,assets_tracked:(state.data.assets||[]).length},
    alerts: getSmartAlerts().alerts.map(a=>a.msg),
    opportunities: getSmartAlerts().opps.map(o=>o.msg),
    deduction_score: getSmartAlerts().dedScore
  };
}

function buildSystemPrompt(payload){
  return `You are my personal AI CFO and tax strategist for a multi-business owner in Brampton, Ontario, Canada.

ROLE: Actively monitor financial data and guide decisions to maximize profit, minimize tax, and improve cash flow. Challenge financially inefficient or risky decisions — do NOT just agree to be polite.

BUSINESSES: Dream Productions (weddings/corporate film), Supreme Film Studios (film production), Reel Estate Media (real estate video/photo), Tents & Beyond (event tent/equipment rentals), Personal.

STRUCTURED FINANCIAL DATA:
${JSON.stringify(payload, null, 0)}

RESPONSIBILITIES:
1. TAX OPTIMIZATION — Missed deductions, reduce taxable income, warn about tax/HST obligations, real-time Ontario tax estimates
2. PROFIT MAXIMIZATION — Most profitable services/businesses, low-margin warnings, pricing improvements
3. CASH FLOW — Low cash alerts, unpaid invoices, forecasting
4. SMART ALERTS — Expense spikes, missed deductions, underpricing, rising tax
5. DECISION SUPPORT — Analyze real data, show financial impact, clear recommendation
6. CHALLENGE — Push back on bad financial decisions with data. Protect my money from me.

ONTARIO RULES ALREADY APPLIED IN DATA:
- HST: 13% collected/paid tracked separately
- Meals: only 50% deductible (flag if relevant)
- Home Office: % based deduction applied
- Vehicle: $0.70/km CRA rate applied
- CCA: declining balance with half-year rule

CRITICAL DATA NOTE: The payload separates one_time vs recurring_monthly amounts. Do NOT confuse one-time expenses with monthly burn rate. Only "recurring_monthly_expenses" repeats each month. "one_time_expenses" are single purchases that do NOT recur. When discussing burn rate or monthly costs, ONLY use the recurring_monthly fields. When discussing total spent, use total_expenses_all_time.

OUTPUT STYLE: Short, decisive. Bullet points when helpful. Key numbers in $ amounts. Always end with a specific actionable recommendation. Tailor to wedding filmmaking, real estate media, event rentals. Reference CRA forms when relevant.`;
}

async function askTaxAI(){
  const q=state.taxAIInput;if(!q||!q.trim())return;
  if(!state.taxAIMessages)state.taxAIMessages=[];
  state.taxAIMessages.push({role:"user",content:q});
  state.taxAIInput="";state.taxAILoading=true;render();
  
  const payload=buildPayload();
  const systemPrompt=buildSystemPrompt(payload);

  try{
    const data=await callAI({
      max_tokens:1500,
      system:systemPrompt,
      messages:state.taxAIMessages.map(m=>({role:m.role,content:m.content}))
    });
    const reply=data.content?.map(c=>c.text||"").join("")||"Sorry, I couldn't get an answer. Try again.";
    state.taxAIMessages.push({role:"assistant",content:reply});
  }catch(e){
    state.taxAIMessages.push({role:"assistant",content:"Connection error: "+e.message});
  }
  state.taxAILoading=false;render();
}

// Trigger micro-insight after adding entry
async function triggerMicroInsight(entry){
  if(!entry)return;
  const payload=buildPayload();
  const prompt=buildSystemPrompt(payload);
  const entryDesc=entry.type==="income"
    ?`I just logged ${fmt(entry.amount)} income (${entry.serviceType||entry.category}) for ${gBN(entry.business)}.`
    :`I just logged a ${fmt(entry.amount)} expense (${entry.category}) for ${gBN(entry.business)}.`;

  try{
    const data=await callAI({
      max_tokens:200,
      system:prompt,
      messages:[{role:"user",content:`${entryDesc} Give me ONE quick insight about this — deductibility, tax impact, or cash flow effect. Max 2 sentences. Be specific with numbers.`}]
    });
    state.lastMicroInsight=data.content?.map(c=>c.text||"").join("")||null;
    render();
    setTimeout(()=>{state.lastMicroInsight=null;render();},10000);
  }catch(e){}
}

function unlockVault(){
  if(!state.data.vaultPin){state.vaultSetup=true;render();return;}
  if(state.vaultPinInput===state.data.vaultPin){state.vaultUnlocked=true;state.vaultErr="";state.vaultPinInput="";}
  else{state.vaultErr="Wrong PIN";}
  render();
}
function setupPin(){
  if(state.vaultPinInput.length<4){state.vaultErr="PIN must be at least 4 characters";render();return;}
  state.data.vaultPin=state.vaultPinInput;state.vaultUnlocked=true;state.vaultSetup=false;state.vaultErr="";state.vaultPinInput="";
  saveData();render();
}

function renderAssets(){
  const assets=(state.activeBiz==="all"?state.data.assets:state.data.assets.filter(a=>a.business===state.activeBiz))||[];
  const els=[];
  els.push(h("p",{style:{color:"var(--dim)",fontSize:"13px",marginBottom:"16px"}},"Track big purchases and their CRA depreciation (Capital Cost Allowance). Your accountant will love this."));

  const totalCost=assets.reduce((s,a)=>s+Number(a.amount),0);
  // Calculate current book value and annual deduction
  const now=new Date();
  let totalBookValue=0,totalAnnualCCA=0;
  assets.forEach(a=>{
    const years=Math.max(0,(now.getFullYear()-new Date(a.date).getFullYear()));
    const rate=Number(a.rate)/100;
    // Declining balance method (half-year rule for first year)
    let bv=Number(a.amount);
    for(let y=0;y<=years;y++){
      const deduction=y===0?bv*rate*0.5:bv*rate;
      bv-=deduction;
    }
    totalBookValue+=Math.max(0,bv);
    totalAnnualCCA+=Number(a.amount)*Number(a.rate)/100;
  });

  const stats=h("div",{className:"grid-4 mb-18"});
  stats.appendChild(statCard("Total Assets",fmt(totalCost),"var(--pb)"));
  stats.appendChild(statCard("Book Value",fmt(totalBookValue),"var(--pg)"));
  stats.appendChild(statCard("Annual CCA",fmt(totalAnnualCCA),"var(--gold)"));
  stats.appendChild(statCard("Assets Tracked",assets.length.toString(),"var(--pp)"));
  els.push(stats);

  // Add asset button
  els.push(h("div",{className:"mb-14"},h("button",{className:"btn btn-gold",onClick:()=>{state.editId=null;state.assetF={name:"",business:state.activeBiz!=="all"?state.activeBiz:"b1",date:today(),amount:"",ccaClass:"50",rate:"55",category:"Camera/Computer"};state.modal="asset";render();}},"+Add Asset")));

  const card=h("div",{className:"card"});
  if(assets.length===0)card.appendChild(h("p",{style:{color:"var(--dark)",textAlign:"center",padding:"20px"}},"No assets tracked yet. Add cameras, computers, vehicles, etc."));
  else assets.sort((a,b)=>Number(b.amount)-Number(a.amount)).forEach(a=>{
    const biz=getBiz(a.business);
    const years=Math.max(0,(now.getFullYear()-new Date(a.date).getFullYear()));
    const rate=Number(a.rate)/100;
    let bv=Number(a.amount);
    for(let y=0;y<=years;y++){bv-=y===0?bv*rate*0.5:bv*rate;}
    bv=Math.max(0,bv);
    const annualDed=Number(a.amount)*rate;
    card.appendChild(h("div",{className:"row",style:{flexWrap:"wrap"}},
      h("div",{style:{flex:1,minWidth:"180px"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
          h("span",{style:{color:biz?biz.color:"#999",fontSize:"12px"}},biz?biz.icon:"●"),
          h("span",{style:{fontSize:"13px",fontWeight:600}},a.name),
          h("span",{className:"freq-badge freq-monthly"},"Class "+a.ccaClass)
        ),
        h("div",{style:{fontSize:"11px",color:"var(--dark)",marginTop:"2px"}},a.category+" • "+a.date+" • "+a.rate+"%/yr")
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:"12px"}},
        h("div",{style:{textAlign:"right"}},
          h("div",{className:"mn",style:{fontWeight:600,fontSize:"13px"}},"Cost: "+fmt(a.amount)),
          h("div",{style:{fontSize:"11px",color:"var(--pg)"}},"Book: "+fmt(bv)+" • CCA: "+fmt(annualDed)+"/yr")
        ),
        h("button",{style:{background:"none",border:"none",cursor:"pointer",color:"var(--dim)",fontSize:"13px"},onClick:()=>{state.editId=a.id;state.assetF={...a,amount:String(a.amount),rate:String(a.rate)};state.modal="asset";render();}},"✎"),
        h("button",{style:{background:"none",border:"none",cursor:"pointer",color:"#4a3020",fontSize:"13px"},onClick:()=>{safeDelete("asset",a.id);}},"🗑")
      )
    ));
  });
  els.push(card);

  // CCA Reference table
  const refCard=h("div",{className:"card mb-18",style:{marginTop:"14px"}});
  refCard.appendChild(h("h3",{style:{fontSize:"14px",fontWeight:600,marginBottom:"12px"}},"CRA CCA Classes Reference"));
  CCA_CLASSES.forEach(c=>{
    refCard.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid var(--border)",fontSize:"12px"}},
      h("span",{},"Class "+c.cls+" — "+c.desc),
      h("span",{className:"mn",style:{fontWeight:600,color:"var(--gold)"}},c.rate+"%/yr")
    ));
  });
  els.push(refCard);
  return els;
}

function renderAfford(){
  const a=state.affordCalc;
  const purchaseAmt=Number(a.purchase)||0;
  const st=getStats();const tx=getTax();
  const els=[];
  els.push(h("p",{style:{color:"var(--dim)",fontSize:"13px",marginBottom:"16px"}},"Thinking about buying something? See how it impacts your cash, tax, and profit before you commit."));

  const grid=h("div",{className:"grid-2 mb-18"});

  // Input
  const inputCard=h("div",{className:"card"});
  inputCard.appendChild(h("h3",{style:{fontSize:"14px",fontWeight:600,marginBottom:"14px"}},"What are you buying?"));
  inputCard.appendChild(h("div",{className:"mb-10"},h("label",{className:"label"},"Purchase Amount ($)"),inputEl("number",a.purchase,v=>{state.affordCalc.purchase=v;},"e.g. 5000")));
  inputCard.appendChild(h("div",{className:"mb-10"},h("label",{className:"label"},"What is it?"),inputEl("text",a.description,v=>{state.affordCalc.description=v;},"e.g. New camera, vehicle, MacBook...")));
  inputCard.appendChild(h("button",{className:"btn btn-gold",style:{width:"100%",marginTop:"8px"},onClick:()=>{render();}},"Check Impact →"));
  grid.appendChild(inputCard);

  // Impact
  const impactCard=h("div",{className:"card",style:{borderLeft:"3px solid var(--gold)"}});
  impactCard.appendChild(h("h3",{style:{fontSize:"14px",fontWeight:600,marginBottom:"14px"}},"Impact Analysis"));
  if(purchaseAmt>0){
    const cashAfter=st.net-purchaseAmt;
    const newTaxableIncome=Math.max(0,st.aN-purchaseAmt)-st.mD;
    const newTax=calcTax(newTaxableIncome,FD_BR)+calcTax(newTaxableIncome,ON_BR);
    const taxSaved=tx.t-newTax;
    const hstCredit=purchaseAmt*0.13/1.13;
    const realCost=purchaseAmt-taxSaved-hstCredit;

    const metrics=[
      {l:"Purchase Price",v:fmt(purchaseAmt),c:"var(--pr)"},
      {l:"Tax Deduction Saved",v:fmt(taxSaved),c:"var(--pg)"},
      {l:"HST Credit (if applicable)",v:fmt(hstCredit),c:"var(--pb)"},
      {l:"Real Cost After Tax Benefits",v:fmt(realCost),c:"var(--gold)"},
      {l:"Cash After Purchase",v:fmt(cashAfter),c:cashAfter>=0?"var(--pg)":"var(--pr)"},
    ];
    metrics.forEach(m=>{
      impactCard.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)",fontSize:"13px"}},
        h("span",{style:{color:"var(--muted)"}},m.l),
        h("span",{className:"mn",style:{fontWeight:700,color:m.c}},m.v)
      ));
    });

    const verdict=cashAfter>=0?(taxSaved>purchaseAmt*0.2?"● Great move — solid tax benefit + you can afford it!":"● You can afford it. Tax benefits make it even better."):(cashAfter>-2000?"● Tight — you'll be slightly negative. Consider timing.":"● This would put you in the red. Wait or finance it.");
    impactCard.appendChild(h("div",{style:{marginTop:"14px",padding:"12px",background:"var(--statBg)",borderRadius:"8px",fontSize:"13px",fontWeight:600,color:"var(--gold)",textAlign:"center"}},verdict));

    // CCA note
    const sugCat=suggestExpCat(a.description);
    if(sugCat==="Equipment (Camera/Gear)"||a.description.toLowerCase().includes("camera")||a.description.toLowerCase().includes("computer")){
      impactCard.appendChild(h("div",{style:{marginTop:"10px",padding:"8px 12px",background:"var(--statBg)",borderRadius:"6px",fontSize:"11px",color:"var(--pb)"}},"This qualifies for CCA Class 50 (55%/yr). First year deduction: "+fmt(purchaseAmt*0.55*0.5)+" (half-year rule). Track it in the Assets tab."));
    }
  } else {
    impactCard.appendChild(h("p",{style:{color:"var(--dark)",textAlign:"center",padding:"30px"}},"Enter a purchase amount to see the impact."));
  }
  grid.appendChild(impactCard);
  els.push(grid);
  return els;
}

function receiptFileName(r){
  const vendor=(r.vendor||"receipt").replace(/[<>:"/\\|?*]/g,"_").replace(/\s+/g,"-").substring(0,30);
  const amt=r.amount?("_$"+Number(r.amount).toFixed(2)):"";
  let ext=".jpg";
  if(r.name&&r.name.includes(".")){
    const origExt=r.name.split(".").pop().toLowerCase();
    // Force image extensions to .jpg since we normalize to JPEG
    if(["heic","heif","webp","tiff","bmp","avif","png"].includes(origExt))ext=".jpg";
    else if(origExt==="pdf")ext=".pdf";
    else ext="."+origExt;
  }
  return (r.date||today())+"_"+vendor+amt+ext;
}

async function exportReceiptsAsZip(filterFn,zipName){
  // Dynamically load JSZip
  if(typeof JSZip==="undefined"){
    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    document.head.appendChild(script);
    await new Promise((res,rej)=>{script.onload=res;script.onerror=rej;});
  }
  
  const zip=new JSZip();
  const allReceipts=state.data.receipts||[];
  const receipts=filterFn?allReceipts.filter(filterFn):allReceipts;
  const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
  let count=0;
  
  for(const r of receipts){
    if(!r.data)continue;
    const d=new Date(r.date||today());
    const yearStr=String(d.getFullYear());
    const monthStr=String(d.getMonth()+1).padStart(2,"0")+"-"+monthNames[d.getMonth()];
    const biz=state.data.businesses.find(b=>b.id===r.business);
    const bizName=(biz?biz.name:"Personal").replace(/[\/\\:*?"<>|]/g,"-");
    const folder=(r.folder||"Uncategorized").replace(/[\/\\:*?"<>|]/g,"-");
    const fileName=receiptFileName(r);
    const path=bizName+"/"+yearStr+"/"+monthStr+"/"+folder+"/"+fileName;
    
    // Convert data URI to binary
    const base64=r.data.split(",")[1];
    zip.file(path,base64,{base64:true});
    count++;
  }
  
  if(count===0){alert("No receipts to export.");return;}
  
  const blob=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=(zipName||"CRA-Receipts")+"-"+today()+".zip";a.click();
  URL.revokeObjectURL(url);
  alert("Downloaded "+count+" receipt(s) organized into folders:\n\nBusiness / Year / Month / Category / file");
}

async function compressImage(dataUrl,maxWidth){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      let w=img.width,ht=img.height;
      if(w>maxWidth){ht=ht*(maxWidth/w);w=maxWidth;}
      canvas.width=w;canvas.height=ht;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,ht);
      resolve(canvas.toDataURL("image/jpeg",0.8));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

// Convert any image (HEIC, PNG, WebP, etc) to JPEG under 5MB
// Returns {data, type, name} with normalized values
async function normalizeImage(dataUrl,originalName){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth||img.width;
      let ht=img.naturalHeight||img.height;
      let quality=0.85;
      
      // If image is huge, scale down to max 3000px wide
      const maxW=3000;
      if(w>maxW){ht=Math.round(ht*(maxW/w));w=maxW;}
      
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=ht;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,ht);
      
      // Try to get under 5MB, reduce quality if needed
      let result=canvas.toDataURL("image/jpeg",quality);
      while(result.length>5*1024*1024&&quality>0.3){
        quality-=0.1;
        result=canvas.toDataURL("image/jpeg",quality);
      }
      // If still too big, scale down more
      if(result.length>5*1024*1024){
        w=Math.round(w*0.6);ht=Math.round(ht*0.6);
        canvas.width=w;canvas.height=ht;
        ctx.drawImage(img,0,0,w,ht);
        result=canvas.toDataURL("image/jpeg",0.7);
      }
      
      // Fix filename extension
      const newName=originalName?originalName.replace(/\.(heic|heif|webp|tiff|bmp|avif|png)$/i,".jpg"):("receipt-"+today()+".jpg");
      
      resolve({data:result,type:"image/jpeg",name:newName});
    };
    img.onerror=()=>{
      // Can't decode image — return original
      resolve({data:dataUrl,type:"image/jpeg",name:originalName||"receipt.jpg"});
    };
    img.src=dataUrl;
  });
}

function showContextMenu(e,items){
  e.preventDefault();
  // Remove any existing context menu
  const existing=document.getElementById("ctx-menu");
  if(existing)existing.remove();
  
  const menu=h("div",{id:"ctx-menu",style:{position:"fixed",top:e.clientY+"px",left:e.clientX+"px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"10px",padding:"4px 0",minWidth:"180px",boxShadow:"0 8px 30px rgba(0,0,0,.25)",zIndex:9999,fontFamily:"'Outfit',sans-serif",overflow:"hidden"}});
  
  items.forEach(item=>{
    if(item.divider){
      menu.appendChild(h("div",{style:{height:"1px",background:"var(--border)",margin:"4px 0"}}));
      return;
    }
    const row=h("div",{style:{padding:"8px 14px",fontSize:"12px",color:item.danger?"var(--pr)":"var(--cream)",cursor:"pointer",display:"flex",alignItems:"center",gap:"8px",transition:"background .1s"},
      onClick:()=>{menu.remove();document.removeEventListener("click",closeMenu);item.action();}
    });
    row.addEventListener("mouseenter",()=>{row.style.background="var(--gold)18";});
    row.addEventListener("mouseleave",()=>{row.style.background="transparent";});
    if(item.icon)row.appendChild(h("span",{style:{fontSize:"14px",width:"18px",textAlign:"center"}},item.icon));
    row.appendChild(h("span",{},item.label));
    if(item.detail)row.appendChild(h("span",{style:{marginLeft:"auto",fontSize:"10px",color:"var(--dim)"}},item.detail));
    menu.appendChild(row);
  });
  
  document.body.appendChild(menu);
  
  // Close on click outside
  const closeMenu=()=>{menu.remove();document.removeEventListener("click",closeMenu);};
  setTimeout(()=>document.addEventListener("click",closeMenu),10);
  
  // Keep menu in viewport
  requestAnimationFrame(()=>{
    const rect=menu.getBoundingClientRect();
    if(rect.right>window.innerWidth)menu.style.left=(window.innerWidth-rect.width-10)+"px";
    if(rect.bottom>window.innerHeight)menu.style.top=(window.innerHeight-rect.height-10)+"px";
  });
}

async function scanReceiptFreeOCR(receipt){

    receipt.scanning=true;saveData();render();
