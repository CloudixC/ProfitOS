    if(receipt.name&&/\.(heic|heif|webp|tiff|bmp|avif)$/i.test(receipt.name)){
      const converted=await compressImage(receipt.data,2000);
      if(converted)imgData=converted;
    }
    
    // Load Tesseract.js if needed
    if(typeof Tesseract==="undefined"){
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      document.head.appendChild(s);
      await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;});
    }
    
    // Run OCR
    const result=await Tesseract.recognize(imgData,"eng",{logger:m=>{
      if(m.status==="recognizing text")receipt.scanProgress=Math.round(m.progress*100);
    }});
    const text=result.data.text;
    
    if(text&&text.trim().length>5){
      // Parse the OCR text to extract receipt info
      const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
      const allText=text.toLowerCase();
      
      // Extract amount — find dollar amounts, take the largest (usually total)
      const amounts=[];
      const amtRegex=/\$\s*(\d{1,6}[.,]\d{2})/g;
      let m;
      while((m=amtRegex.exec(text))!==null){amounts.push(parseFloat(m[1].replace(",",".")));}
      // Also check for amounts without $ sign that are on their own line
      lines.forEach(line=>{
        const bare=line.match(/^(\d{1,6}\.\d{2})$/);
        if(bare)amounts.push(parseFloat(bare[1]));
      });
      if(amounts.length>0){
        // The total is usually the largest amount
        receipt.amount=String(Math.max(...amounts));
      }
      
      // Extract date
      const datePatterns=[
        /(\w+ \d{1,2},?\s*\d{4})/i,           // March 10, 2026
        /(\d{1,2}\/\d{1,2}\/\d{2,4})/,         // 03/10/2026
        /(\d{4}-\d{2}-\d{2})/,                   // 2026-03-10
        /(\d{1,2}-\d{1,2}-\d{2,4})/,            // 10-03-2026
      ];
      for(const dp of datePatterns){
        const dm=text.match(dp);
        if(dm){
          const parsed=new Date(dm[1]);
          if(!isNaN(parsed.getTime())){
            const yr=parsed.getFullYear();const mo=String(parsed.getMonth()+1).padStart(2,"0");const dy=String(parsed.getDate()).padStart(2,"0");
            receipt.date=yr+"-"+mo+"-"+dy;
            break;
          }
        }
      }
      
      // Extract vendor — usually first meaningful line
      for(const line of lines){
        if(line.length>2&&line.length<60&&!/receipt|invoice|order|date|total|subtotal|tax|gst|hst|visa|mastercard|amex|debit|credit|payment|billing|\d{4}-\d{2}-\d{2}/i.test(line)){
          receipt.vendor=line.replace(/[^a-zA-Z0-9\s&'.,-]/g,"").trim();
          break;
        }
      }
      
      // Detect HST/GST
      if(allText.includes("hst")||allText.includes("gst")){
        const hstMatch=text.match(/(?:hst|gst)[:\s]*\$?\s*(\d+[.,]\d{2})/i);
        if(hstMatch)receipt.notes="HST/GST: $"+hstMatch[1];
      }
      
      // Auto-detect folder/category using KEYWORDS ONLY (not OCR guessing)
      // Try vendor name first, then full OCR text
      let detectedFolder="Uncategorized";
      if(receipt.vendor)detectedFolder=autoDetectFolder(receipt.vendor);
      if(detectedFolder==="Uncategorized")detectedFolder=autoDetectFolder(text); // try full OCR text
      if(detectedFolder==="Uncategorized")detectedFolder=autoDetectFolder(receipt.name); // try filename
      receipt.folder=detectedFolder;
      receipt.category=detectedFolder!=="Uncategorized"?detectedFolder:"";
      
      // Build notes from full text summary
      const summary=lines.slice(0,8).join(" | ");
      receipt.notes=(receipt.notes?receipt.notes+" | ":"")+"OCR: "+summary.substring(0,200);
      receipt.aiScanned=true;
    } else {
      receipt.notes="OCR couldn't read text — try a clearer photo";
    }
    
    receipt.scanning=false;receipt.scanProgress=null;
    saveData();render();
  }catch(err){
    console.error("OCR error:",err);
    receipt.scanning=false;receipt.scanProgress=null;
    receipt.notes="OCR failed: "+err.message;
    saveData();render();
  }
}

async function scanReceiptWithAI(receipt){
  if(!receipt.data||!receipt.type||!receipt.type.startsWith("image"))return;
  try{
    receipt.scanning=true;saveData();render();
    
    // Compress image to max 1200px wide to keep base64 reasonable
    const compressed=await compressImage(receipt.data,1200);
    const base64=compressed.split(",")[1];
    const mediaType="image/jpeg";
    
    const catList=["Equipment (Camera/Gear)","Software / Digital Tools","Subcontractors","Rent / Studio","Office Expenses","Phone / Internet","Insurance","Vehicle","Travel","Meals & Entertainment","Payroll / Wages","Accounting / Legal","Advertising / Marketing","Home Office","Supplies","Bank Fees / Interest","Other"];
    const folderList=(state.data.receiptFolders||[]).join(", ");
    const bizList=state.data.businesses.map(b=>b.id+":"+b.name).join(", ");
    
    const promptText="Analyze this receipt image. Extract ALL information. Respond ONLY with JSON, no backticks: {\"vendor\":\"name\",\"amount\":0.00,\"date\":\"YYYY-MM-DD\",\"category\":\"match from: "+catList.join(", ")+"\",\"folder\":\"match from: "+folderList+"\",\"business\":\"match ID from: "+bizList+"\",\"notes\":\"items summary and tax\",\"items\":\"line items\"}. Use empty string or 0 if unreadable. Date default: "+today();

    const data=await callAI({
      max_tokens:500,
      system:"You are a receipt scanner. Extract data from receipt images into JSON. Only output valid JSON, nothing else.",
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
        {type:"text",text:promptText}
      ]}]
    });
    const text=data.content?.map(b=>b.text||"").join("")||"";
    const clean=text.replace(/```json|```/g,"").trim();
    
    try{
      const parsed=JSON.parse(clean);
      if(parsed.vendor)receipt.vendor=parsed.vendor;
      if(parsed.amount&&Number(parsed.amount)>0)receipt.amount=String(parsed.amount);
      if(parsed.date&&parsed.date!=="")receipt.date=parsed.date;
      if(parsed.business&&state.data.businesses.some(b=>b.id===parsed.business))receipt.business=parsed.business;
      
      // Use KEYWORDS for folder/category — more reliable than AI guessing
      let detectedFolder="Uncategorized";
      if(parsed.vendor)detectedFolder=autoDetectFolder(parsed.vendor);
      if(detectedFolder==="Uncategorized"&&parsed.items)detectedFolder=autoDetectFolder(parsed.items);
      if(detectedFolder==="Uncategorized"&&parsed.notes)detectedFolder=autoDetectFolder(parsed.notes);
      receipt.folder=detectedFolder;
      receipt.category=detectedFolder!=="Uncategorized"?detectedFolder:"";
      
      let notes=[];
      if(parsed.notes)notes.push(parsed.notes);
      if(parsed.items)notes.push("Items: "+parsed.items);
      if(notes.length)receipt.notes=notes.join(" | ");
      
      receipt.aiScanned=true;
    }catch(parseErr){
      console.error("AI parse error:",parseErr,"Raw:",text);
      receipt.notes="AI response: "+text.substring(0,200);
    }
    
    receipt.scanning=false;
    saveData();render();
  }catch(err){
    console.error("Receipt scan error:",err);
    receipt.scanning=false;
    receipt.notes="Scan failed ("+err.message+") — edit manually";
    saveData();render();
  }
}

    requestAnimationFrame(()=>{newMain2.style.opacity="1";});
  }
  
  // Restore scroll position and input focus
  requestAnimationFrame(()=>{
    const newMain=document.querySelector(".main");
    if(newMain)newMain.scrollTop=scrollTop;
    
    // Restore focus to the input the user was typing in
    if(activeTag==="INPUT"||activeTag==="TEXTAREA"){
      let target=null;
      // Check for address field first (most specific)
      const addrField=activeEl?activeEl.getAttribute("data-addr-field"):null;
      if(addrField)target=document.querySelector("[data-addr-field='"+addrField+"']");
      // Then search bar
      if(!target&&activeDataAttr)target=document.querySelector("[data-search-bar]");
      // Then by placeholder
      if(!target&&activePlaceholder){
        const inputs=document.querySelectorAll("input,textarea");
        for(const inp of inputs){if(inp.placeholder===activePlaceholder&&inp.value===activeVal){target=inp;break;}}
        if(!target){for(const inp of inputs){if(inp.placeholder===activePlaceholder){target=inp;break;}}}
      }
      if(target){
        target.focus();
        try{target.selectionStart=target.selectionEnd=activePos;}catch(e){}
      }
    }
  });
  }; // end doBuild
  
  // If there's existing content, let fade-out happen first
  if(existingMain&&!skipFade){
    setTimeout(doBuild,80);
  } else {
    render._skipFade=false;
    doBuild();
  }
}

// Local parser — tries to parse without AI
function localParseQuickAdd(text){
  if(!text||text.trim().length<3)return null;
  const t=text.trim().toLowerCase();
  
  // Extract amount — look for $ or number
  let amount=null;
  const amtMatch=text.match(/\$?([\d,]+\.?\d*)/);
  if(amtMatch)amount=parseFloat(amtMatch[1].replace(",",""));
  if(!amount)return null;
  
  // Determine income vs expense
  let type="expense";
  const incomeWords=["received","paid me","income","earned","got paid","payment from","invoice","booked","deposit"];
  if(incomeWords.some(w=>t.includes(w)))type="income";
  
  // Auto-detect category
  let category=suggestExpCat(text)||CRA_CATS[0];
  let serviceType=suggestIncCat(text)||INC_CATS[0];
  
  // Detect business
  let business=state.activeBiz!=="all"?state.activeBiz:"b1";
  if(t.includes("dream"))business="b1";
  else if(t.includes("supreme"))business="b2";
  else if(t.includes("reel")||t.includes("real estate"))business="b3";
  else if(t.includes("tent")||t.includes("event"))business="b4";
  else if(t.includes("personal"))business="b5";
  
  // Detect payment method
  let paymentMethod="Debit Card",paymentHow="In Person";
  if(t.includes("visa")||t.includes("credit"))paymentMethod="TD Visa";
  if(t.includes("etransfer")||t.includes("e-transfer")||t.includes("e transfer"))paymentMethod="E-Transfer";
  if(t.includes("cash"))paymentMethod="Cash";
  if(t.includes("cheque")||t.includes("check"))paymentMethod="Cheque";
  if(t.includes("paypal"))paymentMethod="PayPal";
  if(t.includes("online")||paymentMethod==="E-Transfer"||paymentMethod==="PayPal")paymentHow="Online";
  
  // Detect frequency
  let frequency="one-time";
  if(t.includes("monthly")||t.includes("subscription")||t.includes("recurring"))frequency="monthly";
  
  // Detect HST
  let hstMode="none";
  if(t.includes("+tax")||t.includes("+ tax")||t.includes("plus tax")||t.includes("+hst")||t.includes("+ hst")||t.includes("plus hst")||t.includes("add tax"))hstMode="plus";
  else if(t.includes("hst included")||t.includes("tax included")||t.includes("with tax")||t.includes("with hst")||t.includes("incl tax"))hstMode="included";
  
  // Clean description — remove amount and common filler words
  let desc=text.replace(/\$?[\d,]+\.?\d*/,"").replace(/\b(income|expense|paid|received|got|for|from|to|the|my|a|an)\b/gi,"").trim();
  if(desc.length<2)desc=text;
  // Capitalize first letter
  desc=desc.charAt(0).toUpperCase()+desc.slice(1);
  
  return{
    id:uid(),date:today(),type,amount,category,serviceType,
    business,frequency,hstMode,paymentMethod,paymentHow,
    description:desc,client:""
  };
}

// AI parser — sends to Claude for complex inputs
async function aiParseQuickAdd(text){
  state.quickAddLoading=true;render();
  const biz=state.data.businesses.map(b=>b.name+" ("+b.id+")").join(", ");
  try{
    const data=await callAI({
      max_tokens:300,
      system:`Parse this financial entry into JSON. Return ONLY valid JSON, no markdown, no backticks.
Businesses: ${biz}
Expense categories: ${CRA_CATS.join(", ")}
Income service types: ${INC_CATS.join(", ")}
Payment methods: ${PAY_WITH.join(", ")}
Payment channels: ${PAY_HOW.join(", ")}

Return: {"type":"income"|"expense","amount":number,"description":"string","category":"from CRA_CATS","serviceType":"from INC_CATS","business":"b1-b5","frequency":"one-time"|"monthly"|"yearly","hstMode":"none"|"included","paymentMethod":"from list","paymentHow":"from list","client":"string or empty"}`,
      messages:[{role:"user",content:text}]
    });
    const raw=data.content?.map(c=>c.text||"").join("")||"";
    const clean=raw.replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(clean);
    parsed.id=uid();parsed.date=today();
    state.data.entries.push(parsed);
    saveData();
    state.lastQuickAdd=parsed;
    state.filterMonth="all";state.filterFreq="all";
    state.view=parsed.type==="income"?"income":"expenses";
    setTimeout(()=>{state.lastQuickAdd=null;render();},5000);
    triggerMicroInsight(parsed);
  }catch(e){
    state.lastQuickAdd={error:true,msg:"Couldn't parse that. Try: \"$500 wedding etransfer Dream\""};
    setTimeout(()=>{state.lastQuickAdd=null;render();},4000);
  }
  state.quickAddLoading=false;state.quickAddText="";render();
}

function handleQuickAdd(){
  const text=state.quickAddText;if(!text||!text.trim())return;
  
  // Try local parse first
  const local=localParseQuickAdd(text);
  if(local&&local.amount){
    state.data.entries.push(local);
    saveData();
    state.lastQuickAdd=local;
    state.quickAddText="";
    // Reset filters so user can see the new entry
    state.filterMonth="all";
    state.filterFreq="all";
    // Switch to the right view to show the entry
    state.view=local.type==="income"?"income":"expenses";
    setTimeout(()=>{state.lastQuickAdd=null;render();},5000);
    triggerMicroInsight(local);
    render();
  } else {
    // Fall back to AI
    aiParseQuickAdd(text);
  }
}

function globalSearch(query){
  if(!query||query.length<2)return[];
  const q=query.toLowerCase();const results=[];
  state.data.entries.forEach(e=>{
    const text=[e.description,e.client,e.category,e.serviceType,e.paymentMethod,String(e.amount)].filter(Boolean).join(" ").toLowerCase();
    if(text.includes(q))results.push({type:"entry",item:e,label:(e.type==="income"?"↓":"↑")+" "+fmt(e.amount)+" — "+(e.description||e.category),sub:e.date+" • "+gBN(e.business)});
  });
  state.data.mileage.forEach(m=>{
    const text=[m.from,m.to,m.purpose].filter(Boolean).join(" ").toLowerCase();
    if(text.includes(q))results.push({type:"mileage",item:m,label:""+m.km+"km — "+(m.purpose||m.from+" → "+m.to),sub:m.date});
  });
  state.data.debts.forEach(d=>{
    const text=[d.person,d.description,String(d.amount)].filter(Boolean).join(" ").toLowerCase();
    if(text.includes(q))results.push({type:"debt",item:d,label:""+fmt(d.amount)+" — "+d.person,sub:d.date+" • "+d.direction.replace("_"," ")});
  });
  (state.data.projects||[]).forEach(p=>{
    const text=[p.name,p.serviceType].filter(Boolean).join(" ").toLowerCase();
    if(text.includes(q))results.push({type:"project",item:p,label:""+p.name,sub:p.serviceType+" • "+fmt(p.revenue)});
  });
  return results.slice(0,15);
}

function safeDelete(type,id){
  let item=null;
  if(type==="entry"){item=state.data.entries.find(e=>e.id===id);state.data.entries=state.data.entries.filter(e=>e.id!==id);}
  else if(type==="mileage"){item=state.data.mileage.find(m=>m.id===id);state.data.mileage=state.data.mileage.filter(m=>m.id!==id);}
  else if(type==="debt"){item=state.data.debts.find(d=>d.id===id);state.data.debts=state.data.debts.filter(d=>d.id!==id);}
  else if(type==="project"){item=state.data.projects.find(p=>p.id===id);state.data.projects=state.data.projects.filter(p=>p.id!==id);}
  else if(type==="asset"){item=state.data.assets.find(a=>a.id===id);state.data.assets=state.data.assets.filter(a=>a.id!==id);}
  else if(type==="vault"){item=state.data.vault.find(v=>v.id===id);state.data.vault=state.data.vault.filter(v=>v.id!==id);}
  else if(type==="receipt"){item=state.data.receipts.find(r=>r.id===id);deleteReceiptImage(id);state.data.receipts=state.data.receipts.filter(r=>r.id!==id);}
  else if(type==="invoice"){item=state.data.invoices.find(i=>i.id===id);state.data.invoices=state.data.invoices.filter(i=>i.id!==id);}
  if(item){
    state.undoItem={type,item};
    state.undoTimer=setTimeout(()=>{state.undoItem=null;render();},6000);
  }
  saveData();render();
}
function undoDelete(){
  if(!state.undoItem)return;
  const{type,item}=state.undoItem;
  if(type==="entry")state.data.entries.push(item);
  else if(type==="mileage")state.data.mileage.push(item);
  else if(type==="debt")state.data.debts.push(item);
  else if(type==="project")state.data.projects.push(item);
  else if(type==="asset")state.data.assets.push(item);
  else if(type==="vault")state.data.vault.push(item);
  else if(type==="receipt")state.data.receipts.push(item);
  else if(type==="invoice")state.data.invoices.push(item);
  clearTimeout(state.undoTimer);
  state.undoItem=null;
  saveData();render();
}

// BUDGET PER CATEGORY
// ═══════════════════════════════════════════════════
function getBudgetStatus(){
  if(!state.data.budgets)return[];
  const now=new Date();const monthNow=now.getMonth();
  return Object.entries(state.data.budgets).map(([cat,limit])=>{
    const spent=state.data.entries.filter(e=>e.type==="expense"&&e.category===cat&&new Date(e.date).getMonth()===monthNow).reduce((s,e)=>s+Number(e.amount),0);
    const pct=limit>0?Math.round(spent/limit*100):0;
    return{cat,limit,spent,pct,over:spent>limit};
  }).filter(b=>b.limit>0);
}

    {date:`${yr}-12-31`,label:"Year-End: Buy Equipment for CCA",icon:"●"},
    {date:`${yr}-12-31`,label:"Year-End: Maximize Deductions",icon:"●"},
    {date:`${yr+1}-03-01`,label:"RRSP Deadline (Next Year)",icon:"●"},
  ];

      var hasPaySection=false;
      var page1Inner="";
      var page2Inner="";
      
      if(contentEl){
        var contentKids=contentEl.children;
        for(var i=0;i<contentKids.length;i++){
          var html=contentKids[i].outerHTML;
          if(contentKids[i].className&&contentKids[i].className.indexOf("inv-pay-section")>=0){
            hasPaySection=true;
            page2Inner+=html;
          } else {
            if(!hasPaySection)page1Inner+=html;
            else page2Inner+=html;
          }
        }
      }
      
      // Get content div style for background
      var contentStyle=contentEl?contentEl.getAttribute("style")||"":"";
      
      if(hasPaySection&&page2Inner){
        // First render as single page to measure height
        d.write("<div id='measure' style='width:8.5in;position:absolute;visibility:hidden'>");
        for(var i=0;i<kids.length-1;i++){d.write(kids[i].outerHTML);}
        d.write(footerHTML);
        d.write("</div>");
        d.write("</body></html>");d.close();
        
        // Measure after fonts load, then decide 1 or 2 pages
        var done=false;
        function buildPages(){
          if(done)return;done=true;
          var measureEl=d.getElementById('measure');
          var totalHeight=measureEl?measureEl.scrollHeight:0;
          var pageLimit=960; // ~10in usable height accounting for 0.5in printer margins + page padding
          measureEl.remove();
          
          if(totalHeight>pageLimit){
            // Too tall — split into 2 pages
            d.body.innerHTML="";
            var html="<div class='page'>";
            html+=headerHTML+accentHTML;
            html+="<div class='page-content' style='"+contentStyle+"'>"+page1Inner+"</div>";
            html+="<div class='page-num'>Page 1 of 2</div>";
            html+="<div class='page-footer'>"+footerHTML+"</div>";
            html+="</div>";
            html+="<div class='page'>";
            html+=headerHTML+accentHTML;
            html+="<div class='page-content' style='"+contentStyle+"'>"+page2Inner+"</div>";
            html+="<div class='page-num'>Page 2 of 2</div>";
            html+="<div class='page-footer'>"+footerHTML+"</div>";
            html+="</div>";
            d.body.innerHTML=html;
          } else {
            // Fits on one page
            d.body.innerHTML="";
            var html="<div class='page'>";
            for(var i=0;i<kids.length-1;i++){html+=kids[i].outerHTML;}
            html+="<div class='page-num'>Page 1 of 1</div>";
            html+="<div class='page-footer'>"+footerHTML+"</div>";
            html+="</div>";
            d.body.innerHTML=html;
          }
          setTimeout(function(){w.focus();w.print();},300);
        }
        if(d.fonts&&d.fonts.ready){d.fonts.ready.then(function(){setTimeout(buildPages,400);});}
        setTimeout(buildPages,2500);
      } else {
        // No payment section — always single page
        d.write("<div class='page'>");
        for(var i=0;i<kids.length-1;i++){d.write(kids[i].outerHTML);}
        d.write("<div class='page-num'>Page 1 of 1</div>");
        d.write("<div class='page-footer'>"+footerHTML+"</div>");
        d.write("</div>");
      
        d.write("</body></html>");d.close();
        var done=false;
        function go(){if(done)return;done=true;w.focus();w.print();}
        if(d.fonts&&d.fonts.ready){d.fonts.ready.then(function(){setTimeout(go,500);});}
        setTimeout(go,2500);
      }
    }
    
    // Print button only
    els.push(h("div",{style:{textAlign:"center",marginTop:"12px"}},h("button",{className:"btn btn-gold",style:{padding:"14px 40px",fontSize:"15px"},onClick:()=>{
      openPrintWindow();
    }},"Print / Save as PDF")));
    
    return els;
  }
  
  // ── INVOICE LIST VIEW ──
  const header=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}});
  header.appendChild(h("h1",{style:{display:"flex",alignItems:"center",gap:"10px"}},icon("ac11",28),"Invoices"));
  const headerBtns=h("div",{style:{display:"flex",gap:"8px"}});
  headerBtns.appendChild(h("button",{className:"btn btn-gold",onClick:()=>{
    const biz=state.activeBiz!=="all"?state.activeBiz:"b1";
    const prefix={b1:"DRM",b2:"SUP",b3:"REL",b4:"TNT",b5:"PER"}[biz]||"INV";
    const bizCount=invoices.filter(i=>i.business===biz).length+1;
    const nextNum=prefix+"-"+String(bizCount).padStart(3,"0");
    state.invoiceF={id:null,business:biz,client:"",email:"",clientAddress:"",poNumber:"",serviceFrom:"",serviceTo:"",items:[{desc:"",qty:1,rate:""}],notes:"",dueDate:"",invNum:nextNum,status:"draft",currency:"CAD",paymentMethod:"E-Transfer",discountPct:"",depositPct:"",lateFee:"2",lateDays:"30",recurring:false};
    state.invoiceMode="edit";render();
  }},"+ New Invoice"));
  header.appendChild(headerBtns);
  els.push(header);
  
  // Stats
  const totalOutstanding=invoices.filter(i=>i.status==="sent"||i.status==="viewed"||i.status==="overdue").reduce((s,i)=>s+Number(i.total||0),0);
  const totalPaid=invoices.filter(i=>i.status==="paid").reduce((s,i)=>s+Number(i.total||0),0);
  const statsRow=h("div",{style:{display:"flex",gap:"12px",marginBottom:"16px",flexWrap:"wrap"}});
  statsRow.appendChild(h("div",{className:"stat-card",style:{flex:1,minWidth:"100px"}},h("div",{className:"stat-label"},"Total Invoices"),h("div",{className:"stat-value mn"},String(invoices.length))));
  statsRow.appendChild(h("div",{className:"stat-card",style:{flex:1,minWidth:"100px"}},h("div",{className:"stat-label"},"Outstanding"),h("div",{className:"stat-value mn",style:{color:"#d4956a"}},fmt(totalOutstanding))));
  statsRow.appendChild(h("div",{className:"stat-card",style:{flex:1,minWidth:"100px"}},h("div",{className:"stat-label"},"Collected"),h("div",{className:"stat-value mn",style:{color:"#6ab88a"}},fmt(totalPaid))));
  els.push(statsRow);
  
  // Filter tabs
  if(!state.invoiceFilter)state.invoiceFilter="all";
  const filterRow=h("div",{style:{display:"flex",gap:"6px",marginBottom:"16px",flexWrap:"wrap"}});
  [["all","All"],["draft","Draft"],["sent","Sent"],["viewed","Viewed"],["overdue","Overdue"],["paid","Paid"]].forEach(([fid,label])=>{
    const cnt=fid==="all"?invoices.length:invoices.filter(i=>i.status===fid).length;
    filterRow.appendChild(h("button",{className:"btn "+(state.invoiceFilter===fid?"btn-gold":"btn-ghost"),style:{fontSize:"12px",padding:"6px 14px"},onClick:()=>{state.invoiceFilter=fid;render();}},label+" ("+cnt+")"));
  });
  els.push(filterRow);
  
  // Filtered list
  let filtered=state.invoiceFilter==="all"?invoices:invoices.filter(i=>i.status===state.invoiceFilter);
  filtered=filtered.sort((a,b)=>(b.createdDate||"").localeCompare(a.createdDate||""));
  
  if(filtered.length===0){
    els.push(h("div",{className:"card",style:{textAlign:"center",padding:"40px",color:"var(--muted)"}},
      h("div",{style:{fontSize:"32px",marginBottom:"8px"}},"📄"),
      h("div",{style:{fontSize:"15px",fontWeight:600,marginBottom:"4px"}},"No invoices yet"),
      h("div",{style:{fontSize:"12px"}},"Create your first invoice to start tracking payments.")
    ));
  } else {
    filtered.forEach(inv=>{
      const biz=getBiz(inv.business);
      const st=getStatus(inv.status);
      // Check if overdue
      if(inv.dueDate&&inv.status==="sent"&&inv.dueDate<today()){inv.status="overdue";saveData();}
      
      const card=h("div",{className:"card",style:{marginBottom:"10px",padding:"16px",cursor:"pointer",borderLeft:"4px solid "+(biz?biz.color:"var(--gold)")},onClick:()=>{
        state.invoiceF={...inv};state.invoiceMode="edit";render();
      }});
      
      // Top row: invoice # + client + status + amount
      const topRow=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}});
      topRow.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
        h("span",{className:"mn",style:{fontSize:"14px",fontWeight:700}},"#"+inv.invNum),
        h("span",{style:{fontSize:"14px",fontWeight:600,color:"var(--cream)"}},inv.client||"No client"),
        h("span",{style:{fontSize:"10px",padding:"3px 10px",borderRadius:"12px",background:st.bg,color:st.color,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.5px"}},st.label)
      ));
      topRow.appendChild(h("div",{className:"mn",style:{fontSize:"18px",fontWeight:700,color:inv.status==="paid"?"#6ab88a":"var(--cream)"}},fmt(inv.total||0)));
      card.appendChild(topRow);
      
      // Bottom row: business + dates + actions
      const botRow=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}});
      const meta=h("div",{style:{display:"flex",gap:"8px",fontSize:"11px",color:"var(--muted)"}});
      if(biz)meta.appendChild(h("span",{style:{color:biz.color}},biz.name));
      meta.appendChild(h("span",{},"Created: "+(inv.createdDate||"?")));
      if(inv.dueDate)meta.appendChild(h("span",{},"Due: "+inv.dueDate));
      botRow.appendChild(meta);
      
      // Status actions
      const actions=h("div",{style:{display:"flex",gap:"4px"}});
      if(inv.status==="draft"){
        actions.appendChild(h("button",{className:"btn btn-blue",style:{fontSize:"10px",padding:"4px 10px"},onClick:(e)=>{
          e.stopPropagation();
          if(inv.email){
            // Open email client
            const subject="Invoice "+inv.invNum+" from "+(biz?.name||"Business");
            const body="Please find Invoice #"+inv.invNum+" for "+fmt(inv.total||0)+".\n\nPayment is due "+(inv.dueDate||"upon receipt")+".\n\nThank you,\n"+(biz?.name||"");
            window.open("mailto:"+encodeURIComponent(inv.email)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body));
          }
          inv.status="sent";inv.sentDate=today();saveData();render();
        }},inv.email?"Send & Mark Sent":"Mark Sent"));
      }
      if(inv.status==="sent"||inv.status==="overdue"){
        actions.appendChild(h("button",{className:"btn btn-ghost",style:{fontSize:"10px",padding:"4px 10px"},onClick:(e)=>{e.stopPropagation();inv.status="viewed";saveData();render();}},"Viewed"));
        actions.appendChild(h("button",{className:"btn btn-gold",style:{fontSize:"10px",padding:"4px 10px"},onClick:(e)=>{
          e.stopPropagation();inv.status="paid";inv.paidDate=today();
          // Auto-log as income
          state.data.entries.push({id:uid(),type:"income",date:today(),amount:Math.round(Number(inv.total||0)*100)/100,description:"Invoice #"+inv.invNum+" — "+inv.client,serviceType:inv.items?.[0]?.desc||"",business:inv.business,frequency:"one-time",hstMode:inv.hst>0?"included":"none",paymentMethod:inv.paymentMethod||"E-Transfer",paymentHow:"Online",client:inv.client||""});
          saveData();render();
        }},"Mark Paid"));
      }
      if(inv.status==="viewed"){
        actions.appendChild(h("button",{className:"btn btn-gold",style:{fontSize:"10px",padding:"4px 10px"},onClick:(e)=>{
          e.stopPropagation();inv.status="paid";inv.paidDate=today();
          state.data.entries.push({id:uid(),type:"income",date:today(),amount:Math.round(Number(inv.total||0)*100)/100,description:"Invoice #"+inv.invNum+" — "+inv.client,serviceType:inv.items?.[0]?.desc||"",business:inv.business,frequency:"one-time",hstMode:inv.hst>0?"included":"none",paymentMethod:inv.paymentMethod||"E-Transfer",paymentHow:"Online",client:inv.client||""});
          saveData();render();
        }},"Mark Paid"));
      }
      // Duplicate button
      actions.appendChild(h("button",{className:"btn btn-ghost",style:{fontSize:"10px",padding:"4px 10px"},onClick:(e)=>{
        e.stopPropagation();
        const prefix=inv.invNum.split("-")[0]||"INV";
        const bizCount=invoices.filter(i=>i.business===inv.business).length+1;
        const dup={...JSON.parse(JSON.stringify(inv)),id:uid(),invNum:prefix+"-"+String(bizCount).padStart(3,"0"),status:"draft",createdDate:today(),paidDate:"",sentDate:"",depositPaid:false};
        invoices.push(dup);saveData();render();
      }},"Dup"));
      if(inv.status!=="cancelled"&&inv.status!=="paid"){
        actions.appendChild(h("button",{className:"btn btn-ghost",style:{fontSize:"10px",padding:"4px 10px",color:"var(--pr)"},onClick:(e)=>{e.stopPropagation();if(confirm("Cancel this invoice?"))inv.status="cancelled";saveData();render();}},"Cancel"));
      }
      actions.appendChild(h("button",{className:"btn btn-ghost",style:{fontSize:"10px",padding:"4px 10px",color:"var(--pr)"},onClick:(e)=>{e.stopPropagation();safeDelete("invoice",inv.id);}},"Del"));
      botRow.appendChild(actions);
      card.appendChild(botRow);
      
      els.push(card);
    });
  }
  
  return els;
}

function renderTaxCal(){
  const els=[];
  const deadlines=getTaxDeadlines();
  els.push(h("p",{style:{color:"var(--dim)",fontSize:"13px",marginBottom:"16px"}},"Key CRA dates and deadlines. Never miss a filing."));
  
  const upcoming=deadlines.filter(d=>!d.past);
  const passed=deadlines.filter(d=>d.past);
  
  if(upcoming.length>0){
    els.push(h("h3",{style:{fontFamily:"var(--heading)",fontSize:"16px",marginBottom:"12px",display:"flex",alignItems:"center",gap:"6px"}},icon("ac14",18),"Upcoming Deadlines"));
    const card=h("div",{className:"card mb-18"});
    upcoming.forEach(d=>{
      const urgency=d.daysLeft<=7?"var(--pr)":d.daysLeft<=30?"var(--po)":"var(--pb)";
      card.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--border)"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
          h("span",{style:{fontSize:"18px"}},d.icon),
          h("div",{},h("div",{style:{fontSize:"13px",fontWeight:600}},d.label),h("div",{style:{fontSize:"11px",color:"var(--dark)"}},d.date))
        ),
        h("div",{style:{textAlign:"right"}},
          h("div",{className:"mn",style:{fontSize:"16px",fontWeight:700,color:urgency}},d.daysLeft+" days"),
          h("div",{style:{fontSize:"9px",color:urgency,fontWeight:600,textTransform:"uppercase"}},d.daysLeft<=7?"URGENT":d.daysLeft<=30?"SOON":"")
        )
      ));
    });
    els.push(card);
  }
  
  if(passed.length>0){
    els.push(h("h3",{style:{fontFamily:"var(--heading)",fontSize:"16px",marginBottom:"12px",color:"var(--dim)"}},"✓ Recently Passed"));
    const passedCard=h("div",{className:"card",style:{opacity:.6}});
    passed.forEach(d=>{
      passedCard.appendChild(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)",fontSize:"12px"}},
        h("span",{},d.icon+" "+d.label+" • "+d.date),
        h("span",{style:{color:"var(--pg)"}},"✓ Passed")
      ));
    });
    els.push(passedCard);
  }
  return els;
}

async function loginAs(userId){
  currentUser=userId;
  
  // Reset state data to defaults
  state.data={
    businesses:DEF_BIZ,entries:[],mileage:[],debts:[],vault:[],vaultPin:"",
    logins:[],cards:[],secureNotes:[],
    homeOffice:0,projects:[],targets:{monthly:0,yearly:0},assets:[],
    receipts:[],receiptFolders:["Uncategorized",...CRA_CATS],
    invoices:[]
  };
  state.dark=false;
  document.documentElement.setAttribute("data-theme","");
  state.view="ceo";state.activeBiz="all";state.modal=null;state.editId=null;
  state.taxAIMessages=null;state.weeklyInsight=null;state.lastMicroInsight=null;
  
  if(userId==="demo"){
    // Load demo data
    state.data=generateDemoData();
    await saveData();
  }
  
  await loadData();
}

function logout(){
  currentUser=null;
  state.taxAIMessages=null;state.weeklyInsight=null;state.lastMicroInsight=null;
  renderLogin();
}

// Boot — show login screen
renderLogin();

// ═══════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════
document.addEventListener("keydown",(e)=>{
  // Don't trigger when typing in inputs
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
  if(!currentUser)return;
  
  // Ctrl/Cmd + shortcuts
  if(e.ctrlKey||e.metaKey){
    if(e.key==="i"||e.key==="I"){e.preventDefault();state.modal="income";render();} // Ctrl+I = Add Income
    else if(e.key==="e"||e.key==="E"){e.preventDefault();state.modal="expense";render();} // Ctrl+E = Add Expense
    else if(e.key==="k"||e.key==="K"){e.preventDefault();const sb=document.querySelector("[data-search-bar]");if(sb)sb.focus();} // Ctrl+K = Focus search
    else if(e.key==="b"||e.key==="B"){e.preventDefault();
      const d=new Date();const pad=n=>String(n).padStart(2,"0");
      const nowStr=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+"-"+pad(d.getMinutes())+"-"+pad(d.getSeconds());
      const backup={version:"cra-v8",date:today()+" "+d.toLocaleTimeString(),user:currentUser,data:state.data};
      const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");
      a.href=url;a.download="CRA_Backup_"+currentUser+"_"+nowStr+".json";a.click();URL.revokeObjectURL(url);
    } // Ctrl+B = Quick backup
    else if(e.key==="r"||e.key==="R"){e.preventDefault();
      const inp=document.createElement("input");inp.type="file";inp.accept=".json";
      inp.addEventListener("change",async ev=>{
        const file=ev.target.files[0];if(!file)return;
        try{
          const text=await file.text();const backup=JSON.parse(text);
          let d=null;
          if(backup.data)d=backup.data;
          else if(backup.entries||backup.businesses)d=backup;
          if(d){
            const label=backup.date?"backup from "+backup.date:"this file";
            if(confirm("Restore from "+label+"? This will REPLACE all current data.")){
              state.data={...state.data,...d};
              if(!state.data.invoices)state.data.invoices=[];
              if(!state.data.receipts)state.data.receipts=[];
              saveData();render();
              alert("Data restored!");
            }
          }else{alert("Invalid backup file.");}
        }catch(err){alert("Error: "+err.message);}
      });
      inp.click();
    } // Ctrl+R = Quick restore
  }
  
  // Single key shortcuts (no modifier)
  if(e.key==="Escape"&&state.modal){state.modal=null;state.editId=null;render();}
  if(e.key==="?"&&!e.ctrlKey){state.modal="shortcuts";render();} // Esc = Close modal
  
  // Number keys for navigation
  if(e.key==="1"&&!e.ctrlKey){state.view="ceo";render();}
  if(e.key==="2"&&!e.ctrlKey){state.view="income";render();}
  if(e.key==="3"&&!e.ctrlKey){state.view="expenses";render();}
  if(e.key==="4"&&!e.ctrlKey){state.view="invoice";render();}
  if(e.key==="5"&&!e.ctrlKey){state.view="projects";render();}
});

// ═══════════════════════════════════════════════════
// INVOICE REMINDERS — check on each render for overdue/upcoming
// ═══════════════════════════════════════════════════
function checkInvoiceReminders(){
  if(!state.data.invoices)return;
  const now=today();
  let alerts=[];
  state.data.invoices.forEach(inv=>{
    // Auto-mark overdue
    if(inv.dueDate&&inv.dueDate<now&&(inv.status==="sent"||inv.status==="viewed")){
      inv.status="overdue";
    }
    // Collect unpaid invoice alerts
    if(inv.status==="overdue"){
      const daysPast=Math.floor((new Date()-new Date(inv.dueDate))/(1000*60*60*24));
      alerts.push({type:"overdue",inv,days:daysPast});
    }
    if(inv.status==="sent"||inv.status==="viewed"){
      if(inv.dueDate){
        const daysLeft=Math.floor((new Date(inv.dueDate)-new Date())/(1000*60*60*24));
        if(daysLeft<=3&&daysLeft>=0)alerts.push({type:"due_soon",inv,days:daysLeft});
      }
    }
    // Check payment splits
    if(inv.paymentSplits){
      inv.paymentSplits.forEach(sp=>{
        if(!sp.paid&&sp.dueDate&&sp.dueDate<now){
          alerts.push({type:"split_overdue",inv,split:sp});
        }
      });
    }
  });
  state.invoiceAlerts=alerts;
}
